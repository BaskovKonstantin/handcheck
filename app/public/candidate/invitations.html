<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Приглашения — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="page-header">
        <h1>Приглашения</h1>
        <p class="lede">Вилка зарплаты и текст оффера. Контакты компании — только после принятия.</p>
      </header>
      <div id="list"><p class="loading">Загрузка…</p></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      async function load() {
        await HandCheck.candidateNav();
        const d = await HandCheck.api("/api/candidate/invitations");
          if (!d.items.length) {
            list.innerHTML = HandCheck.emptyState(
              "Пока нет приглашений",
              "Пройдите тест и держите профиль открытым — компании приглашают сами.",
              "/candidate/tasks",
              "К заданиям"
            );
            return;
          }
          list.innerHTML = d.items
            .map((i) => {
              const contacts =
                i.status === "accepted"
                  ? `<div class="contacts-block"><strong>Контакты компании</strong><br>Email: ${i.employerContactEmail || "—"}<br>Канал: ${i.contactChannel}</div>`
                  : "";
              const actions =
                i.status === "sent" || i.status === "viewed"
                  ? `<div class="invite-actions">
                <button class="btn-primary" data-id="${i.id}" data-a="accept">Принять</button>
                <button class="btn-ghost" data-id="${i.id}" data-a="decline">Отклонить</button>
              </div>`
                  : i.status === "accepted"
                    ? `<a class="btn-primary" href="/call/${i.id}">Перейти к звонку</a>`
                    : "";
              return `<article class="invite-card">
              <h3>${i.companyName}</h3>
              <p class="invite-meta"><span class="salary-band">₽${i.salaryFrom.toLocaleString("ru")} – ₽${i.salaryTo.toLocaleString("ru")}</span> · <span class="status-pill ${i.status}">${i.status}</span></p>
              <p>${i.offerText}</p>${contacts}${actions}</article>`;
            })
            .join("");
          list.querySelectorAll("button[data-a]").forEach((b) => {
            b.onclick = async () => {
              await HandCheck.api(`/api/candidate/invitations/${b.dataset.id}/${b.dataset.a}`, {
                method: "POST",
              });
              location.reload();
            };
          });
      }
      HandCheck.loadPanel(list, load);
    </script>
  </body>
</html>
