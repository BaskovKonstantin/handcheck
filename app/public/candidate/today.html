<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сегодня — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="page-header">
        <h1>Сегодня</h1>
        <p class="lede">Ваша категория по тесту — без числовых оценок. Краткий обзор активности.</p>
      </header>
      <div id="dash"><p class="loading"><span class="loading-dot"></span>Загрузка…</p></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const dash = document.getElementById("dash");

      async function render() {
        HandCheck.candidateNav();
        const [cat, inv] = await Promise.all([
          HandCheck.api("/api/candidate/category"),
          HandCheck.api("/api/candidate/invitations"),
        ]);
        const pending = (inv.items || []).filter((i) => i.status === "sent" || i.status === "viewed").length;
        const accepted = (inv.items || []).filter((i) => i.status === "accepted").length;
        if (!cat.label) {
          dash.innerHTML = `
            ${HandCheck.emptyState(
              "Категория ещё не подтверждена",
              "Пройдите батарею заданий — специализация и грейд появятся здесь.",
              "/candidate/tasks",
              "Начать тест"
            )}`;
          return;
        }
        const retake = cat.retakeAt
          ? `<p class="invite-meta">Пересдача возможна после ${new Date(cat.retakeAt).toLocaleDateString("ru")}</p>`
          : "";
        dash.innerHTML = `
          <div class="dashboard-grid">
            <article class="dashboard-card dashboard-card-featured">
              <h3>Категория</h3>
              <div class="dashboard-value"><span class="category-pill">${cat.label}</span></div>
              ${retake}
            </article>
            <article class="dashboard-card">
              <h3>Приглашения</h3>
              <div class="dashboard-value">${pending}</div>
              <p class="invite-meta">ожидают ответа</p>
              <a class="btn-ghost btn-sm" href="/candidate/invitations">Открыть</a>
            </article>
            <article class="dashboard-card">
              <h3>Звонки</h3>
              <div class="dashboard-value">${accepted}</div>
              <p class="invite-meta">принято — можно в комнату</p>
              <a class="btn-ghost btn-sm" href="/candidate/calls">Звонки</a>
            </article>
          </div>
          <div class="form-actions" style="margin-top:1.5rem">
            <a class="btn-ghost" href="/candidate/profile">Профиль</a>
            <a class="btn-primary" href="/candidate/tasks">Задания</a>
          </div>`;
      }

      HandCheck.loadPanel(dash, render);
    </script>
  </body>
</html>
