<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <main class="column auth-column">
      <a class="logo" href="/" id="auth-logo">HandCheck</a>
      <header class="page-header">
        <h1>Вход и регистрация</h1>
        <p class="lede">Демо: anna@demo.local или cafe@demo.local, пароль из .env.example. Код подтверждения 000000.</p>
      </header>
      <div class="panel auth-panel">
        <label>Email <input type="email" id="email" autocomplete="username" /></label>
        <label>Пароль <input type="password" id="password" autocomplete="current-password" /></label>
        <label>Роль
          <select id="role">
            <option value="candidate">Кандидат</option>
            <option value="employer">Работодатель</option>
          </select>
        </label>
        <p class="field-error" id="err" hidden></p>
        <div class="form-actions">
          <button class="btn-primary" type="button" id="login">Войти</button>
          <button class="btn-ghost" type="button" id="register">Зарегистрироваться</button>
        </div>
        <hr style="border:none;border-top:1px solid var(--line);margin:1.5rem 0" />
        <label>Подтверждение кода <input id="code" autocomplete="one-time-code" placeholder="000000" /></label>
        <button class="btn-ghost" type="button" id="confirm">Подтвердить email</button>
      </div>
    </main>
    <script src="/app.js"></script>
    <script>
      document.getElementById("auth-logo").innerHTML = `${HandCheck.LOGO_MARK}<span>HandCheck</span>`;
      const q = new URLSearchParams(location.search);
      if (q.get("role")) document.getElementById("role").value = q.get("role");
      const err = document.getElementById("err");
      const showErr = (m) => {
        err.hidden = false;
        err.textContent = m;
      };
      document.getElementById("login").onclick = async () => {
        err.hidden = true;
        try {
          const j = await HandCheck.api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          location.href = j.user.role === "employer" ? "/employer/deck" : "/candidate/today";
        } catch (e) {
          showErr(HandCheck.formatApiError(e));
        }
      };
      document.getElementById("register").onclick = async () => {
        err.hidden = true;
        try {
          await HandCheck.api("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
              role: document.getElementById("role").value,
            }),
          });
          showErr("Аккаунт создан. Введите код 000000 в демо и нажмите «Подтвердить email».");
        } catch (e) {
          showErr(HandCheck.formatApiError(e));
        }
      };
      document.getElementById("confirm").onclick = async () => {
        err.hidden = true;
        try {
          await HandCheck.api("/api/auth/confirm", {
            method: "POST",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              code: document.getElementById("code").value,
            }),
          });
          showErr("Email подтверждён — нажмите «Войти».");
        } catch (e) {
          showErr(HandCheck.formatApiError(e));
        }
      };
    </script>
  </body>
</html>
