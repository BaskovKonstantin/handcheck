<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Приглашения — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Приглашения</h1>
          <p class="lede">Вилка зарплаты и текст оффера. Контакты компании — только после принятия.</p>
        </div>
      </header>
      <div id="list"><p class="loading">Загрузка…</p></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      async function load() {
        const esc = HandCheck.escapeHtml;
        list.innerHTML = HandCheck.skeletonBlocks(2);
        const d = await HandCheck.api("/api/candidate/invitations");
        if (!d.items.length) {
          list.innerHTML = HandCheck.emptyState(
            "Пока нет приглашений",
            "Пройдите тест и держите профиль открытым — компании приглашают сами.",
            "/candidate/tasks",
            "К заданиям"
          );
          return;
        }
        list.innerHTML = `<div class="invite-card-grid">${d.items
          .map((i) => {
            const contacts =
              i.status === "accepted"
                ? `<div class="contacts-block"><strong>Контакты компании</strong><br>Email: ${esc(i.employerContactEmail || "—")}<br>Канал: ${esc(i.contactChannel || "—")}</div>`
                : "";
            const actions =
              i.status === "sent" || i.status === "viewed"
                ? `<div class="invite-actions">
                <button class="btn-primary" data-id="${esc(i.id)}" data-a="accept">Принять</button>
                <button class="btn-ghost" data-id="${esc(i.id)}" data-a="decline">Отклонить</button>
              </div>`
                : i.status === "accepted"
                  ? `<a class="btn-primary" href="/call/${esc(i.id)}">Перейти к звонку</a>`
                  : "";
            const stCls = HandCheck.invitationStatusClass(i.status);
            return `<article class="invite-card invite-card-expressive">
              <div class="invite-card-top">
                <h3>${esc(i.companyName)}</h3>
                <span class="status-pill ${stCls}">${HandCheck.invitationStatusLabel(i.status)}</span>
              </div>
              <p class="salary-hero">${HandCheck.formatSalaryRange(i.salaryFrom, i.salaryTo)}</p>
              <p class="invite-offer-text">${esc(i.offerText || "")}</p>${contacts}${actions}</article>`;
          })
          .join("")}</div>`;
        list.querySelectorAll("button[data-a]").forEach((b) => {
          b.onclick = async () => {
            await HandCheck.api(`/api/candidate/invitations/${b.dataset.id}/${b.dataset.a}`, {
              method: "POST",
            });
            location.reload();
          };
        });
      }
      HandCheck.bootCabinetPage("candidate", () => load());
    </script>
  </body>
</html>
