<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Звонки — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Звонки</h1>
          <p class="lede">Только принятые приглашения. Разбор звонка кандидату не показывается.</p>
        </div>
      </header>
      <div id="stats"></div>
      <div id="list"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      const statsEl = document.getElementById("stats");

      const ICON_READY =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4h3l1 4-2 1a12 12 0 0 0 5 5l1-2 4 1v3c-6-1-11-6-12-12z" fill="currentColor"/></svg></span>';
      const ICON_LIVE =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span>';
      const ICON_DONE =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>';

      function formatCallWhen(row) {
        const iso = row.startedAt || row.invitationAt;
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "—";
        return d.toLocaleString("ru-RU", {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function splitCalls(items) {
        const active = [];
        const ended = [];
        for (const row of items || []) {
          if (row.callStatus === "ended") ended.push(row);
          else active.push(row);
        }
        return { active, ended };
      }

      function callCard(row, prominent) {
        const statusCls = HandCheck.callStatusClass(row.callStatus);
        const salary = HandCheck.formatSalaryRange(row.salaryFrom, row.salaryTo);
        const when = formatCallWhen(row);
        const cta =
          row.callStatus === "ready" || row.callStatus === "live"
            ? `<a class="btn-primary${prominent ? "" : " btn-sm"}" href="${row.roomUrl}">Комната</a>`
            : "";
        return `<article class="invite-card invite-card-expressive call-card call-card-${statusCls}">
          <div class="invite-card-top">
            <div>
              <h3>${row.companyName}</h3>
              <p class="invite-meta">${row.needTitle}</p>
            </div>
            <span class="status-pill ${statusCls}">${HandCheck.callStatusLabel(row.callStatus)}</span>
          </div>
          <p class="salary-hero">${salary}</p>
          <p class="call-datetime"><span class="call-datetime-label">Когда:</span> ${when}</p>
          <div class="invite-actions">${cta}</div>
        </article>`;
      }

      async function load() {
        statsEl.innerHTML = HandCheck.skeletonBlocks(3);
        list.innerHTML = HandCheck.skeletonBlocks(3);
        const d = await HandCheck.api("/api/candidate/calls");
        const items = d.items || [];
        const { active, ended } = splitCalls(items);
        const ready = active.filter((r) => r.callStatus !== "live").length;
        const live = active.filter((r) => r.callStatus === "live").length;
        statsEl.innerHTML = HandCheck.statTilesHtml([
          {
            variant: "clay",
            icon: ICON_READY,
            label: "Готовы",
            value: ready,
            hint: "Можно войти в комнату",
          },
          {
            variant: "forest",
            icon: ICON_LIVE,
            label: "В эфире",
            value: live,
            hint: "Звонок идёт",
          },
          {
            variant: "ink",
            icon: ICON_DONE,
            label: "Завершено",
            value: ended.length,
            hint: "Архив без разбора",
          },
        ]);
        if (!items.length) {
          list.innerHTML = HandCheck.emptyState(
            "Звонков пока нет",
            "Примите приглашение — здесь появится ссылка на комнату.",
            "/candidate/invitations",
            "К приглашениям"
          );
          return;
        }
        const activeHtml = active
          .map((row) => callCard(row, row.callStatus === "ready"))
          .join("");
        const endedSection =
          ended.length > 0
            ? `<details class="calls-archive">
                <summary class="calls-archive-summary">Завершённые звонки (${ended.length})</summary>
                <div class="invite-card-grid">${ended.map((row) => callCard(row, false)).join("")}</div>
              </details>`
            : "";
        list.innerHTML = `<div class="invite-card-grid call-list-active">${activeHtml}</div>${endedSection}`;
      }

      HandCheck.bootCabinetPage("candidate", () => HandCheck.loadPanel(list, load));
    </script>
  </body>
</html>
