<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Задания — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Тест</h1>
          <p class="lede">8 коротких ответов (минута на каждый) и мини-проект на неделю. Результат — категория, не балл.</p>
        </div>
      </header>
      <div id="panel" class="panel"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const panel = document.getElementById("panel");
      let attemptId = null;

      const SPECS = [
        { value: "backend", label: "Backend" },
        { value: "frontend", label: "Frontend" },
        { value: "qa", label: "QA" },
      ];
      const GRADES = [
        { value: "junior", label: "Junior" },
        { value: "middle", label: "Middle" },
        { value: "senior", label: "Senior" },
      ];

      const QUICK_COUNT = 8;

      function batteryStepIndicator(currentIndex) {
        const steps = [];
        for (let i = 0; i < QUICK_COUNT; i += 1) {
          const state = i < currentIndex ? "done" : i === currentIndex ? "current" : "";
          steps.push(`<li class="battery-step ${state}" aria-current="${i === currentIndex ? "step" : "false"}">
            <span class="battery-step-num">${i + 1}</span>
            <span class="battery-step-label">Короткий ${i + 1}</span>
          </li>`);
        }
        const workState =
          currentIndex >= QUICK_COUNT ? (currentIndex === QUICK_COUNT ? "current" : "done") : "";
        steps.push(`<li class="battery-step battery-step-work ${workState}">
          <span class="battery-step-num">${QUICK_COUNT + 1}</span>
          <span class="battery-step-label">Мини-проект</span>
        </li>`);
        return `<ol class="battery-steps" aria-label="Шаги батареи">${steps.join("")}</ol>`;
      }

      function formatCountdown(ms) {
        if (ms <= 0) return "0:00";
        const totalSec = Math.ceil(ms / 1000);
        const d = Math.floor(totalSec / 86400);
        const h = Math.floor((totalSec % 86400) / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (d > 0) return `${d} д ${h} ч`;
        if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      async function postTelemetry(events) {
        if (!events.length) return;
        try {
          await HandCheck.api("/api/assessment/events", {
            method: "POST",
            body: JSON.stringify({ events }),
          });
        } catch {
          /* ignore */
        }
      }

      function isChoiceAvailable(field, value) {
        if (field === "spec" || field === "specialization") return value === "backend";
        if (field === "grade") return value === "middle";
        return false;
      }

      function choiceChips(name, options, selected) {
        return `<div class="choice-chip-row" role="radiogroup" aria-label="${name}">
          ${options
            .map((o) => {
              const available = isChoiceAvailable(name, o.value);
              const cls = `choice-chip${o.value === selected ? " active" : ""}${available ? "" : " disabled"}`;
              const hint = available ? "" : ' <span class="invite-meta">скоро</span>';
              return `<button type="button" class="${cls}" data-choice="${o.value}" data-field="${name}"${
                available ? "" : " disabled"
              }>${o.label}${hint}</button>`;
            })
            .join("")}
          <input type="hidden" id="${name}" value="${selected}" />
        </div>`;
      }

      function bindChoiceChips(root) {
        root.querySelectorAll(".choice-chip:not(.disabled)").forEach((btn) => {
          btn.addEventListener("click", () => {
            const field = btn.dataset.field;
            root.querySelectorAll(`.choice-chip[data-field="${field}"]`).forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(field).value = btn.dataset.choice;
          });
        });
      }

      async function renderStartForm(category) {
        const onCooldown = Boolean(category?.cooldownActive && category?.retakeAt);
        const retakeWhen = onCooldown ? HandCheck.formatRetakeDateMoscow(category.retakeAt) : "";
        const retakeExplain = retakeWhen
          ? `<p class="invite-meta">Пересдать тест можно после ${retakeWhen} — успешная пересдача обновит категорию.</p>`
          : `<p class="invite-meta">Успешная пересдача обновит категорию.</p>`;
        const catBlock = category?.label
          ? `<div class="battery-last-result">
              <span class="invite-meta">Текущая категория</span>
              <span class="category-pill">${category.label}</span>
              ${retakeExplain}
            </div>`
          : `<p class="invite-meta">${onCooldown ? "Категория не подтверждена." : "Категория появится после первого завершённого теста."}</p>${retakeWhen ? retakeExplain : ""}`;
        panel.innerHTML = `
          ${catBlock}
          <p class="invite-meta">Выберите специализацию и грейд. Сейчас доступна только категория Backend × Middle — другие тесты готовятся.</p>
          <div class="form-field">
            <span class="form-label">Специализация</span>
            ${choiceChips("spec", SPECS, "backend")}
          </div>
          <div class="form-field">
            <span class="form-label">Грейд</span>
            ${choiceChips("grade", GRADES, "middle")}
          </div>
          <button class="btn-primary" id="start" type="button" ${onCooldown ? "disabled" : ""} ${
            onCooldown ? `title="Пересдача возможна после ${retakeWhen}"` : ""
          }>${onCooldown ? "Пересдача недоступна" : "Пройти тест"}</button>
          <p class="field-error" id="err" hidden></p>`;
        bindChoiceChips(panel);
        document.getElementById("start").onclick = async () => {
          if (onCooldown) return;
          const err = document.getElementById("err");
          err.hidden = true;
          const spec = document.getElementById("spec").value;
          const grade = document.getElementById("grade").value;
          if (spec !== "backend" || grade !== "middle") {
            err.hidden = false;
            err.textContent = "Тест для выбранной категории пока не готов.";
            return;
          }
          try {
            await HandCheck.api("/api/assessment/battery/start", {
              method: "POST",
              body: JSON.stringify({ specialization: spec, grade }),
            });
            await init();
          } catch (e) {
            err.hidden = false;
            err.textContent = HandCheck.formatApiError(e);
          }
        };
      }

      async function init() {
        const seq = HandCheck.nextCabinetPageLoad();
        panel.innerHTML = HandCheck.skeletonBlocks(2);
        const [cur, category] = await Promise.all([
          HandCheck.api("/api/assessment/battery/current"),
          HandCheck.api("/api/candidate/category").catch(() => ({ label: null })),
        ]);
        if (HandCheck.isStaleCabinetPageLoad(seq)) return;
        if (!cur.battery) {
          await renderStartForm(category);
          return;
        }
        const attempts = cur.battery.attempts || [];
        const submitted = attempts.filter((a) => a.submitted).length;
        const next = attempts.find((a) => !a.submitted);
        if (!next) {
          panel.innerHTML =
            batteryStepIndicator(QUICK_COUNT + 1) +
            HandCheck.emptyState(
              "Тест завершён",
              category.label
                ? `Ваша категория: ${category.label}. Обновление на экране «Сегодня».`
                : "Категория обновится на экране «Сегодня».",
              "/candidate/today",
              "Открыть сегодня"
            );
          return;
        }
        attemptId = next.id;
        const t = await HandCheck.api(`/api/assessment/tasks/${attemptId}`);
        const draftKey = `handcheck:draft:v1:${attemptId}`;
        const saved = localStorage.getItem(draftKey);
        let restored = "";
        let localAt = 0;
        if (saved) {
          try {
            const p = JSON.parse(saved);
            restored = p.text || "";
            localAt = Number(p.at) || 0;
          } catch {
            restored = "";
          }
        }
        const serverDraft = t.draftText || "";
        if (!restored && serverDraft) restored = serverDraft;
        else if (restored && serverDraft && serverDraft.length > restored.length) restored = serverDraft;
        const stepIndex = submitted;
        const metaLine = HandCheck.formatSpecGradeLabel(
          cur.battery.specialization,
          cur.battery.claimedGrade
        );
        const answerMax = t.answerMax || 4000;
        const timerLabel =
          t.type === "quick"
            ? "Минута на ответ"
            : "Неделя на мини-проект";
        panel.innerHTML = `
          ${batteryStepIndicator(stepIndex)}
          <p class="invite-meta">${HandCheck.escapeHtml(metaLine)}</p>
          <p class="battery-timer" id="timer-line" aria-live="polite"><span class="battery-timer-label">${timerLabel}:</span> <strong id="timer-val">—</strong></p>
          <p>${HandCheck.escapeHtml(t.prompt)}</p>
          <textarea id="answer" rows="8" maxlength="${answerMax}">${HandCheck.escapeHtml(restored)}</textarea>
          <p class="invite-meta" id="answer-len">0 / ${answerMax} символов</p>
          <p class="invite-meta" id="draft-note" hidden>Черновик восстановлен</p>
          <button class="btn-primary" id="submit">Отправить ответ</button>
          <p class="field-error" id="err" hidden></p>`;
        if (restored) document.getElementById("draft-note").hidden = false;
        const ta = document.getElementById("answer");
        const lenEl = document.getElementById("answer-len");
        const syncLen = () => {
          lenEl.textContent = `${ta.value.length} / ${answerMax} символов`;
        };
        syncLen();
        ta.addEventListener("input", syncLen);
        let firstInputSent = false;
        const telemetryQueue = [];
        const enqueueEvent = (event_type, payload) => {
          telemetryQueue.push({ attemptId, event_type, payload });
          if (telemetryQueue.length >= 4) postTelemetry(telemetryQueue.splice(0));
        };
        ta.addEventListener("paste", (ev) => {
          const clip = ev.clipboardData?.getData("text") || "";
          enqueueEvent("paste", { length: clip.length, chars: clip.length });
        });
        ta.addEventListener("input", () => {
          if (!firstInputSent && ta.value.length > 0) {
            firstInputSent = true;
            enqueueEvent("first_input", { length: ta.value.length });
          }
        });
        ta.addEventListener("focus", () => enqueueEvent("focus", null));
        ta.addEventListener("blur", () => enqueueEvent("blur", null));
        let submitting = false;
        const deadlineMs = t.deadlineAt ? new Date(t.deadlineAt).getTime() : null;
        const timerVal = document.getElementById("timer-val");
        let tickTimer = null;
        const syncDeadlineUi = () => {
          if (!deadlineMs) return;
          const left = deadlineMs - Date.now();
          timerVal.textContent = formatCountdown(left);
          if (t.type === "quick" && left <= 0 && !submitting) {
            document.getElementById("submit").click();
          }
        };
        if (deadlineMs) {
          syncDeadlineUi();
          tickTimer = setInterval(syncDeadlineUi, 250);
        }
        const persistDraft = async () => {
          if (submitting) return;
          const text = ta.value;
          localStorage.setItem(draftKey, JSON.stringify({ text, at: Date.now() }));
          try {
            await HandCheck.api(`/api/assessment/tasks/${attemptId}/draft`, {
              method: "PATCH",
              body: JSON.stringify({ answerText: text }),
            });
          } catch {
            /* ignore draft race after submit */
          }
        };
        ta.addEventListener("blur", () => {
          persistDraft();
        });
        let draftTimer = null;
        if (t.type === "work") {
          draftTimer = setInterval(() => {
            persistDraft();
          }, 10000);
        }
        document.getElementById("submit").onclick = async () => {
          const err = document.getElementById("err");
          err.hidden = true;
          const attemptsLeft = attempts.filter((a) => !a.submitted).length;
          if (attemptsLeft === 1) {
            const ok = window.confirm("Это последний ответ в тесте. Отправить и завершить тест?");
            if (!ok) return;
          }
          submitting = true;
          if (draftTimer) clearInterval(draftTimer);
          if (tickTimer) clearInterval(tickTimer);
          await postTelemetry(telemetryQueue.splice(0));
          try {
            await HandCheck.api(`/api/assessment/tasks/${attemptId}/submit`, {
              method: "POST",
              body: JSON.stringify({ answerText: ta.value }),
            });
            localStorage.removeItem(draftKey);
            await init();
          } catch (e) {
            if (e.data?.error === "quick_time_expired") {
              err.hidden = false;
              err.textContent = HandCheck.formatApiError(e);
              localStorage.removeItem(draftKey);
              await init();
              return;
            }
            err.hidden = false;
            err.textContent = HandCheck.formatApiError(e);
          } finally {
            submitting = false;
          }
        };
      }

      HandCheck.bootCabinetPage("candidate", () =>
        init().catch(() => {
          panel.innerHTML = HandCheck.emptyState("Ошибка", "Войдите как кандидат.", "/auth", "Войти");
        })
      );
    </script>
  </body>
</html>
