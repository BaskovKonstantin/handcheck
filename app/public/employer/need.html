<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Потребность — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Потребность</h1>
          <p class="lede">Название, специализация, грейд, стек и домен задают, кого покажет колода.</p>
        </div>
      </header>
      <div id="stats"></div>
      <div class="panel" id="form"><p class="loading"><span class="loading-dot"></span>Загрузка…</p></div>
      <p class="invite-meta need-save-hint" id="save-hint">Измените поля формы, чтобы активировать «Сохранить».</p>
      <button class="btn-primary need-save-btn" type="button" id="save" disabled>Сохранить</button>
    </main>
    <script src="/app.js"></script>
    <script>
      const SPEC_LABEL = { backend: "Backend", frontend: "Frontend", qa: "QA" };
      const GRADE_LABEL = { junior: "Junior", middle: "Middle", senior: "Senior" };
      let needs = [];
      let activeId = null;
      let snapshot = "";

      const statsEl = document.getElementById("stats");
      const formEl = document.getElementById("form");
      const saveBtn = document.getElementById("save");

      function currentPayload() {
        const stackRaw = document.getElementById("stack")?.value || "";
        const stack = stackRaw
          .split(/[,;]+/)
          .map((s) => s.trim())
          .filter(Boolean);
        return {
          title: document.getElementById("title")?.value || "",
          domainText: document.getElementById("domain")?.value || "",
          specialization: document.getElementById("spec")?.value || "backend",
          grade: document.getElementById("grade")?.value || "middle",
          stack,
          active: document.getElementById("need-active")?.checked ?? true,
        };
      }

      function paintTiles(n) {
        const spec = n.specialization || "backend";
        const grade = n.grade || "middle";
        const stack = (n.stack || []).join(", ") || "—";
        statsEl.innerHTML = HandCheck.statTilesHtml([
          {
            variant: "forest",
            label: "Специализация",
            value: SPEC_LABEL[spec] || spec,
            hint: "Категория кандидатов в колоде",
          },
          {
            variant: "clay",
            label: "Грейд",
            value: GRADE_LABEL[grade] || grade,
            hint: "Уровень подбора",
          },
          {
            variant: "ink",
            label: "Стек",
            value: stack,
            hint: "Фильтр и подсказки в списке",
          },
        ]);
      }

      function paintForm(n) {
        const specGrade = (item) => {
          const label = HandCheck.formatSpecGradeLabel(item.specialization, item.grade);
          const inactive = item.active ? "" : " (неактивна)";
          return label ? ` · ${label}${inactive}` : inactive;
        };
        const options = needs
          .map(
            (item) =>
              `<option value="${item.id}"${item.id === n.id ? " selected" : ""}>${HandCheck.escapeHtml(item.title || "Без названия")}${HandCheck.escapeHtml(specGrade(item))}</option>`
          )
          .join("");
        const stackStr = (n.stack || []).join(", ");
        formEl.innerHTML = `
          <div class="form-actions need-toolbar" style="margin-bottom:1rem">
            <label class="form-label need-select-wrap">Выбранная потребность
              <select id="need-select">${options}</select>
            </label>
            <button type="button" class="btn-ghost need-create-btn" id="create-need">Создать потребность</button>
          </div>
          <div id="create-need-sheet" class="need-create-sheet hidden" hidden>
            <label>Название новой потребности <input id="create-title" maxlength="120" placeholder="Например, Backend middle" /></label>
            <div class="form-actions">
              <button type="button" class="btn-primary btn-sm" id="create-need-submit">Создать</button>
              <button type="button" class="btn-ghost btn-sm" id="create-need-cancel">Отмена</button>
            </div>
          </div>
          <label class="need-active-toggle"><input type="checkbox" id="need-active"${n.active ? " checked" : ""} /> Потребность активна (можно приглашать кандидатов)</label>
          <label>Название <input id="title" value="${HandCheck.escapeHtml(n.title || "")}" /></label>
          <label>Специализация
            <select id="spec">
              <option value="backend"${specSel(n.specialization, "backend")}>Backend</option>
              <option value="frontend"${specSel(n.specialization, "frontend")}>Frontend</option>
              <option value="qa"${specSel(n.specialization, "qa")}>QA</option>
            </select>
          </label>
          <label>Грейд
            <select id="grade">
              <option value="junior"${specSel(n.grade, "junior")}>Junior</option>
              <option value="middle"${specSel(n.grade, "middle")}>Middle</option>
              <option value="senior"${specSel(n.grade, "senior")}>Senior</option>
            </select>
          </label>
          <label>Стек (через запятую) <input id="stack" value="${HandCheck.escapeHtml(stackStr)}" placeholder="node, postgres" /></label>
          <label>Домен <textarea id="domain" rows="3">${HandCheck.escapeHtml(n.domainText || "")}</textarea></label>`;
        snapshot = JSON.stringify(currentPayload());
        refreshDirty();
        document.getElementById("need-select").onchange = () => {
          activeId = document.getElementById("need-select").value;
          HandCheck.persistEmployerNeedId(activeId);
          const p = new URLSearchParams(location.search);
          p.set("need", activeId);
          history.replaceState({}, "", `${location.pathname}?${p.toString()}`);
          const picked = needs.find((x) => x.id === activeId) || needs[0];
          paintTiles(picked);
          document.getElementById("title").value = picked.title || "";
          document.getElementById("domain").value = picked.domainText || "";
          document.getElementById("spec").value = picked.specialization || "backend";
          document.getElementById("grade").value = picked.grade || "middle";
          document.getElementById("stack").value = (picked.stack || []).join(", ");
          const activeEl = document.getElementById("need-active");
          if (activeEl) activeEl.checked = Boolean(picked.active);
          snapshot = JSON.stringify(currentPayload());
          refreshDirty();
        };
        const createSheet = document.getElementById("create-need-sheet");
        document.getElementById("create-need").onclick = () => {
          createSheet.hidden = false;
          createSheet.classList.remove("hidden");
          document.getElementById("create-title")?.focus();
        };
        document.getElementById("create-need-cancel").onclick = () => {
          createSheet.hidden = true;
          createSheet.classList.add("hidden");
        };
        document.getElementById("create-need-submit").onclick = async () => {
          const title = document.getElementById("create-title")?.value?.trim();
          if (!title) {
            HandCheck.toast("Укажите название потребности", "error");
            return;
          }
          try {
            const res = await HandCheck.api("/api/employer/needs", {
              method: "POST",
              body: JSON.stringify({
                title,
                specialization: "backend",
                grade: "middle",
                domainText: "",
                stack: [],
              }),
            });
            const d = await HandCheck.api("/api/employer/needs");
            needs = d.items || [];
            activeId = res.id;
            HandCheck.persistEmployerNeedId(activeId);
            const p = new URLSearchParams(location.search);
            p.set("need", activeId);
            history.replaceState({}, "", `${location.pathname}?${p.toString()}`);
            const picked = needs.find((x) => x.id === activeId) || needs[0];
            paintTiles(picked);
            paintForm(picked);
            bindDirty();
            createSheet.hidden = true;
            createSheet.classList.add("hidden");
            HandCheck.toast("Потребность создана", "success");
          } catch (e) {
            HandCheck.toast(HandCheck.formatApiError(e), "error");
          }
        };
        bindDirty();
      }

      function specSel(value, expected) {
        return (value || "backend") === expected ? " selected" : "";
      }

      function bindDirty() {
        formEl.querySelectorAll("input,textarea,select").forEach((el) => {
          if (el.id === "need-select") return;
          el.addEventListener("input", refreshDirty);
          el.addEventListener("change", refreshDirty);
        });
      }

      function refreshDirty() {
        const unchanged = JSON.stringify(currentPayload()) === snapshot;
        saveBtn.disabled = unchanged;
        const hint = document.getElementById("save-hint");
        if (hint) hint.hidden = !unchanged;
      }

      async function loadNeedForm() {
        statsEl.innerHTML = HandCheck.skeletonBlocks(3);
        formEl.innerHTML = HandCheck.skeletonBlocks(1);
        const d = await HandCheck.api("/api/employer/needs");
        needs = d.items || [];
        if (!needs.length) {
          const res = await HandCheck.api("/api/employer/needs", {
            method: "POST",
            body: JSON.stringify({
              title: "Моя потребность",
              specialization: "backend",
              grade: "middle",
              domainText: "",
              stack: [],
            }),
          });
          const again = await HandCheck.api("/api/employer/needs");
          needs = again.items || [];
          activeId = res.id;
        }
        const params = new URLSearchParams(location.search);
        activeId = HandCheck.resolveEmployerNeedId(needs, params);
        const n = needs.find((x) => x.id === activeId) || needs[0];
        activeId = n.id;
        HandCheck.persistEmployerNeedId(activeId);
        const p = new URLSearchParams(location.search);
        if (p.get("need") !== activeId) {
          p.set("need", activeId);
          history.replaceState({}, "", `${location.pathname}?${p.toString()}`);
        }
        paintTiles(n);
        paintForm(n);
      }

      HandCheck.bootCabinetPage("employer", () => loadNeedForm());
      saveBtn.onclick = async () => {
        const body = currentPayload();
        try {
          await HandCheck.api(`/api/employer/needs/${activeId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          HandCheck.toast("Потребность сохранена", "success");
          await loadNeedForm();
        } catch (e) {
          HandCheck.toast(HandCheck.formatApiError(e), "error");
        }
      };
    </script>
  </body>
</html>
