<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Звонок — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="call-room-page">
    <main class="call-room column">
      <header class="call-room-hero">
        <h1>Комната звонка</h1>
        <p class="lede">Согласие на запись обязательно. Состояние комнаты обновляется после входа.</p>
      </header>
      <p class="call-state-banner" id="state-banner">Подготовка комнаты…</p>
      <label class="panel" style="display:block;margin-bottom:1rem">
        <input type="checkbox" id="consent" />
        Разговор сохранится и будет использован, чтобы оценить соответствие задаче.
      </label>
      <p><span class="rec-dot" id="rec-indicator"></span><span id="rec-label">Запись выключена</span></p>
      <video id="local" class="call-video" autoplay muted playsinline></video>
      <p id="timer" class="dashboard-value" style="font-size:1.25rem">00:00</p>
      <div class="form-actions">
        <button class="btn-primary" id="join" disabled>Войти в комнату</button>
        <button class="btn-ghost" id="end" hidden>Завершить</button>
      </div>
      <p class="field-error" id="room-err" hidden></p>
    </main>
    <script src="/app.js"></script>
    <script src="/call.js"></script>
  </body>
</html>
