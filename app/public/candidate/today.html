<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сегодня — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Сегодня</h1>
          <p class="lede">Ваша категория по тесту — без числовых оценок. Краткий обзор активности.</p>
        </div>
      </header>
      <div id="dash"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const dash = document.getElementById("dash");

      const ICON_CAT =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7L12 16.8 5.7 21l2.3-7-6-4.6h7.6L12 2z" fill="currentColor"/></svg></span>';
      const ICON_MAIL =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 8l8 5 8-5v10H4V8zm16-2H4l8 5 8-5z" fill="currentColor"/></svg></span>';
      const ICON_CALL =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4h3l1 4-2 1a12 12 0 0 0 5 5l1-2 4 1v3c-6-1-11-6-12-12z" fill="currentColor"/></svg></span>';

      function isJoinableCallStatus(status) {
        return status === "ready" || status === "live";
      }

      function formatInviteDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" });
      }

      function callStatusByInvitation(callItems) {
        const map = new Map();
        (callItems || []).forEach((row) => {
          if (row.invitationId) map.set(row.invitationId, row.callStatus || "ready");
        });
        return map;
      }

      function groupAcceptedInvites(items, statusByInv) {
        const groups = new Map();
        (items || [])
          .filter((i) => i.status === "accepted")
          .forEach((i) => {
            const key = i.id;
            const list = groups.get(key) || [];
            list.push(i);
            groups.set(key, list);
          });
        return [...groups.values()]
          .map((list) => {
            const sorted = list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const primary = sorted[0];
            const joinable = sorted.filter((inv) =>
              isJoinableCallStatus(statusByInv.get(inv.id) || "ready")
            );
            const extra = sorted.length > 1 ? ` · ещё ${sorted.length - 1}` : "";
            const dateStr = formatInviteDate(primary.createdAt);
            const salary = HandCheck.formatSalaryRange(primary.salaryFrom, primary.salaryTo);
            const metaParts = [dateStr, salary].filter(Boolean);
            const roomHref =
              joinable.length > 1
                ? "/candidate/calls"
                : joinable.length === 1
                  ? `/call/${joinable[0].id}`
                  : "/candidate/calls";
            const roomLabel =
              joinable.length > 1 ? "Все звонки" : joinable.length === 1 ? "Комната" : "Звонки";
            return {
              primary,
              meta: `${metaParts.join(" · ")}${extra}`,
              joinableCount: joinable.length,
              roomHref,
              roomLabel,
            };
          })
          .sort((a, b) => new Date(b.primary.createdAt) - new Date(a.primary.createdAt))
          .slice(0, 4);
      }

      function buildUpcomingSteps(invItems, cat, callItems) {
        const statusByInv = callStatusByInvitation(callItems);
        const steps = [];
        const onCooldown = Boolean(cat.cooldownActive && cat.retakeAt);
        if (!cat.label) {
          steps.push({
            tone: "clay",
            title: "Пройти тест",
            meta: "Без теста категория не появится в подборе",
            cta: '<a class="btn-primary btn-sm" href="/candidate/tasks">Начать</a>',
          });
        } else if (!onCooldown) {
          steps.push({
            tone: "forest",
            title: "Улучшить категорию",
            meta: "Пересдайте тест, когда будете готовы",
            cta: '<a class="btn-primary btn-sm" href="/candidate/tasks">Задания</a>',
          });
        }
        (invItems || [])
          .filter((i) => i.status === "sent" || i.status === "viewed")
          .slice(0, 4)
          .forEach((i) => {
            const dateStr = formatInviteDate(i.createdAt);
            const salary = HandCheck.formatSalaryRange(i.salaryFrom, i.salaryTo);
            steps.push({
              tone: "clay",
              title: `Ответить: ${i.companyName}`,
              meta: [dateStr, salary].filter(Boolean).join(" · "),
              cta: '<a class="btn-ghost btn-sm" href="/candidate/invitations">Приглашения</a>',
            });
          });
        groupAcceptedInvites(invItems, statusByInv).forEach(
          ({ primary, meta, joinableCount, roomHref, roomLabel }) => {
            if (joinableCount > 0) {
              steps.push({
                tone: "forest",
                title: `Звонок с ${primary.companyName}`,
                meta: meta || "Приглашение принято — можно войти в комнату",
                cta: `<a class="btn-primary btn-sm" href="${roomHref}">${roomLabel}</a>`,
              });
            }
          }
        );
        if (!steps.length) {
          steps.push({
            tone: "muted",
            title: "Новых шагов нет — приглашения придут сами",
            meta: "Держите профиль открытым к приглашениям",
            cta: '<a class="btn-primary btn-sm" href="/candidate/tasks">Задания</a>',
          });
        }
        return steps;
      }

      async function render() {
        const seq = HandCheck.nextCabinetPageLoad();
        dash.innerHTML = HandCheck.skeletonBlocks(3);
        const [cat, inv, calls] = await Promise.all([
          HandCheck.api("/api/candidate/category"),
          HandCheck.api("/api/candidate/invitations"),
          HandCheck.api("/api/candidate/calls"),
        ]);
        if (HandCheck.isStaleCabinetPageLoad(seq)) return;
        const items = inv.items || [];
        const callItems = calls.items || [];
        const pending = items.filter((i) => i.status === "sent" || i.status === "viewed").length;
        const joinableCount = callItems.filter((r) => isJoinableCallStatus(r.callStatus)).length;
        const callsHint =
          joinableCount > 0 ? "принято — можно в комнату" : "нет активных комнат";
        if (!cat.label) {
          dash.innerHTML =
            HandCheck.emptyState(
              "Категория ещё не подтверждена",
              "Пройдите тест — специализация и грейд появятся здесь.",
              "/candidate/tasks",
              "Пройти тест"
            ) + HandCheck.timelineSection("Ближайшие шаги", buildUpcomingSteps(items, cat, callItems));
          return;
        }
        const onCooldown = Boolean(cat.cooldownActive && cat.retakeAt);
        const retakeDate = onCooldown ? HandCheck.formatRetakeDateMoscow(cat.retakeAt) : "";
        const improveBtn = onCooldown
          ? `<button class="btn-improve-locked btn-sm" type="button" disabled title="Пересдача с ${retakeDate}"><span class="btn-lock" aria-hidden="true">🔒</span> Улучшить до ${retakeDate}</button>`
          : `<a class="btn-primary btn-sm" href="/candidate/tasks">Улучшить категорию</a>`;
        const categoryHint = `<p class="invite-meta">Задания подтверждают навык — при успешной пересдаче категория обновится.</p>
              ${improveBtn}`;
        const timeline = HandCheck.timelineSection(
          "Ближайшие шаги",
          buildUpcomingSteps(items, cat, callItems)
        );
        dash.innerHTML = `
          <div class="stat-tile-grid stat-tile-grid-today">
            <article class="stat-tile stat-tile-forest">
              <div class="stat-tile-label">${ICON_CAT} Категория</div>
              <div class="stat-tile-value"><span class="category-pill">${cat.label}</span></div>
              ${categoryHint}
            </article>
            <article class="stat-tile stat-tile-clay">
              <div class="stat-tile-label">${ICON_MAIL} Приглашения</div>
              <div class="stat-tile-value">${pending}</div>
              <p class="invite-meta">ожидают ответа</p>
              <a class="btn-ghost btn-sm" href="/candidate/invitations">Открыть</a>
            </article>
            <article class="stat-tile stat-tile-ink">
              <div class="stat-tile-label">${ICON_CALL} Звонки</div>
              <div class="stat-tile-value">${joinableCount}</div>
              <p class="invite-meta">${callsHint}</p>
              <a class="btn-ghost btn-sm" href="/candidate/calls">Звонки</a>
            </article>
          </div>
          ${timeline}`;
      }

      HandCheck.bootCabinetPage("candidate", () => render());
    </script>
  </body>
</html>
