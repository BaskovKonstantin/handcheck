<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Приглашения — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <h1>Приглашения</h1>
      <div id="list"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      HandCheck.candidateNav();
      HandCheck.api("/api/candidate/invitations").then((d) => {
        document.getElementById("list").innerHTML =
          d.items.map(
            (i) =>
              `<div class="panel invite"><strong>${i.companyName}</strong> ₽${i.salaryFrom}–${i.salaryTo}
              <button class="btn-primary" data-id="${i.id}" data-a="accept">Принять</button>
              <button class="btn-ghost" data-id="${i.id}" data-a="decline">Отклонить</button></div>`
          ).join("") || '<p class="empty">Пока нет приглашений</p>';
        document.querySelectorAll("button[data-a]").forEach((b) => {
          b.onclick = async () => {
            await HandCheck.api(`/api/candidate/invitations/${b.dataset.id}/${b.dataset.a}`, {
              method: "POST",
            });
            location.reload();
          };
        });
      });
    </script>
  </body>
</html>
