<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Звонки — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="page-header">
        <h1>Звонки</h1>
        <p class="lede">Только принятые приглашения. Разбор звонка кандидату не показывается.</p>
      </header>
      <div id="list"><p class="loading"><span class="loading-dot"></span>Загрузка…</p></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");

      async function load() {
        await HandCheck.candidateNav();
        const d = await HandCheck.api("/api/candidate/calls");
        if (!d.items.length) {
          list.innerHTML = HandCheck.emptyState(
            "Звонков пока нет",
            "Примите приглашение — здесь появится ссылка на комнату.",
            "/candidate/invitations",
            "К приглашениям"
          );
          return;
        }
        list.innerHTML = d.items
          .map(
            (c) =>
              `<a class="row-link invite-card" href="${c.roomUrl}"><strong>${c.companyName}</strong> — ${c.needTitle}<br><span class="invite-meta">Статус: <span class="status-pill ${c.callStatus === "live" ? "accepted" : ""}">${c.callStatus}</span></span></a>`
          )
          .join("");
      }

      HandCheck.loadPanel(list, load);
    </script>
  </body>
</html>
