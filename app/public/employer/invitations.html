<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Приглашения — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Исходящие приглашения</h1>
          <p class="lede">После принятия здесь появятся телефон и email кандидата.</p>
        </div>
      </header>
      <div id="stats" class="invite-stats-block"></div>
      <div id="list" class="invite-list-block"></div>
    </main>
    <div class="invite-sheet hidden" id="assign-test-sheet">
      <div class="invite-panel assign-test-panel">
        <h2 id="assign-test-title">Назначить тест</h2>
        <p class="invite-meta" id="assign-test-sub" hidden></p>
        <div id="assign-test-list" class="assign-test-list"></div>
        <p class="field-error" id="assign-test-err" hidden></p>
        <button class="btn-ghost" type="button" id="assign-test-cancel">Отмена</button>
      </div>
    </div>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      const statsEl = document.getElementById("stats");
      const esc = HandCheck.escapeHtml;

      function cardStatusClass(status) {
        if (status === "accepted") return "invite-card-status-accepted";
        if (status === "declined") return "invite-card-status-declined";
        return "invite-card-status-sent";
      }

      function formatInviteDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" });
      }

      async function loadInvitations() {
        const seq = HandCheck.nextCabinetPageLoad();
        statsEl.innerHTML = HandCheck.skeletonBlocks(3);
        list.innerHTML = HandCheck.skeletonBlocks(2);
        const d = await HandCheck.api("/api/employer/invitations");
        if (HandCheck.isStaleCabinetPageLoad(seq)) return;
        const items = d.items || [];
        const sent = items.filter((i) => i.status === "sent" || i.status === "viewed").length;
        const accepted = items.filter((i) => i.status === "accepted").length;
        const declined = items.filter((i) => i.status === "declined").length;
        statsEl.innerHTML = HandCheck.statTilesHtml(
          [
            { variant: "clay", label: "Ожидают", value: sent, hint: "Ответ кандидата" },
            { variant: "forest", label: "Принято", value: accepted, hint: "Контакты открыты" },
            { variant: "ink", label: "Отклонено", value: declined, hint: "Без контактов" },
          ],
          { gridClass: "stat-tile-grid-compact" }
        );
        if (!items.length) {
          list.innerHTML = HandCheck.emptyState(
            "Приглашений пока нет",
            "Откройте колоду и пригласите кандидата с вилкой зарплаты.",
            "/employer/deck",
            "В колоду"
          );
          return;
        }
        list.innerHTML = `<div class="invite-card-grid">${items
          .map((i) => {
            const contacts =
              i.status === "accepted"
                ? `<div class="contacts-block"><strong>Контакты кандидата</strong><br>Телефон: ${esc(i.candidatePhone || "—")}<br>Email: ${esc(i.candidateContactEmail || "—")}</div>`
                : "";
            const call =
              i.status === "accepted"
                ? i.callStatus === "ended"
                  ? `<a class="btn-primary" href="/call/${esc(i.id)}">Итог звонка</a>`
                  : `<a class="btn-primary" href="/call/${esc(i.id)}">Комната звонка</a>`
                : "";
            const priorDecline = i.hadPriorDecline
              ? `<p class="invite-meta">Ранее отклонил приглашение по этой потребности</p>`
              : "";
            const aiBadge = i.viaAiClient
              ? `<span class="status-pill status-pill-asis sent">Через ИИ-клиент</span>`
              : "";
            const stCls = HandCheck.invitationStatusClass(i.status);
            const sentOn = formatInviteDate(i.createdAt);
            const meta = HandCheck.joinMetaParts([i.needTitle, sentOn ? `отправлено ${sentOn}` : ""]);
            const channel = i.contactChannel
              ? `<p class="invite-meta">Канал связи: ${esc(i.contactChannel)}</p>`
              : "";
            const offer = i.offerText
              ? `<p class="invite-offer-text">${esc(i.offerText)}</p>`
              : "";
            const companyTests = i.companyTests || [];
            const companyTestsUi = HandCheck.renderInvitationCompanyTestsHtml(companyTests, esc);
            const assignedTestIds = companyTests
              .filter((ct) => ["assigned", "started", "submitted"].includes(ct.status))
              .map((ct) => ct.testId)
              .join(",");
            const assignTestBtn =
              i.status === "accepted" && i.hasAssignableCompanyTest
                ? `<button type="button" class="btn-ghost btn-sm" data-assign-test data-invitation-id="${esc(i.id)}" data-candidate-id="${esc(i.candidateId)}" data-need-id="${esc(i.needId)}" data-need-title="${esc(i.needTitle)}" data-candidate-name="${esc(i.candidateName)}" data-assigned-test-ids="${esc(assignedTestIds)}">Назначить тест</button>`
                : "";
            return `<article class="invite-card invite-card-expressive ${cardStatusClass(i.status)}">
              <div class="invite-card-top">
                <h3>${esc(i.candidateName)}</h3>
                <span class="status-pill ${stCls}">${HandCheck.invitationStatusLabel(i.status)}</span>
                ${aiBadge}
              </div>
              ${meta ? `<p class="invite-meta">${esc(meta)}</p>` : ""}
              <p class="salary-hero">${HandCheck.formatSalaryRange(i.salaryFrom, i.salaryTo)}</p>
              ${offer}
              ${channel}
              ${priorDecline}
              ${contacts}
              <div class="invite-actions">${call} ${assignTestBtn}</div>
              ${companyTestsUi.rowsHtml}
              ${companyTestsUi.reviewPanels}
            </article>`;
          })
          .join("")}</div>`;
        list.querySelectorAll("[data-review-test]").forEach((btn) => {
          btn.addEventListener("click", () => loadTestReview(btn.dataset.reviewTest));
        });
        list.querySelectorAll("[data-assign-test]").forEach((btn) => {
          btn.addEventListener("click", () => assignTestToCandidate(btn));
        });
      }

      async function loadTestReview(assignmentId) {
        const panel = document.getElementById(`review-${assignmentId}`);
        if (!panel) return;
        panel.hidden = false;
        panel.innerHTML = HandCheck.skeletonBlocks(1);
        const data = await HandCheck.api(`/api/employer/test-assignments/${assignmentId}`);
        const st = data.statusLabel ? ` · ${esc(data.statusLabel)}` : "";
        panel.innerHTML = `<h4 class="h4">Ответы: ${esc(data.testTitle)}${st}</h4>${(data.items || [])
          .map((it) => {
            const markCore =
              it.choiceMark === "ok"
                ? '<span class="status-pill accepted">✓</span>'
                : it.choiceMark === "bad"
                  ? '<span class="status-pill declined">✗</span>'
                  : "";
            const timeoutNote = it.timedOut
              ? '<span class="invite-meta">время вышло</span>'
              : "";
            const mark = [markCore, timeoutNote].filter(Boolean).join(" ");
            const chips = (it.keywordHits || [])
              .map((k) => `<span class="chip chip-skill">${esc(k)}</span>`)
              .join("");
            const paste = it.pasteInputMark ? HandCheck.renderPasteInputMark(it.pasteInputMark) : "";
            const choiceText = (it.choiceLabels && it.choiceLabels.length
              ? it.choiceLabels
              : it.choiceIds || []
            ).join(", ");
            const answer =
              it.kind === "single" || it.kind === "multi" ? esc(choiceText) : esc(it.answerText || "");
            return `<article class="employer-test-preview-card"><p><strong>${esc(it.prompt)}</strong> ${mark}</p>
              <p class="invite-meta">${answer}</p>
              <div class="chip-row">${chips}${paste}</div></article>`;
          })
          .join("")}`;
      }

      let assignContext = null;

      function closeAssignSheet() {
        document.getElementById("assign-test-sheet").classList.add("hidden");
        assignContext = null;
      }

      async function openAssignTestSheet(btn) {
        const candidateId = btn.dataset.candidateId;
        const needId = btn.dataset.needId || "";
        const invitationId = btn.dataset.invitationId || "";
        const qs = needId
          ? `?status=published&needId=${encodeURIComponent(needId)}`
          : "?status=published";
        const testsRes = await HandCheck.api(`/api/employer/tests${qs}`);
        const assignedRaw = btn.dataset.assignedTestIds || "";
        const assignedSet = new Set(
          assignedRaw.split(",").map((x) => x.trim()).filter(Boolean)
        );
        const tests = (testsRes.groups || [])
          .flatMap((g) => g.tests || [])
          .filter((t) => !assignedSet.has(t.id));
        if (!tests.length) {
          HandCheck.toast("Нет опубликованных тестов для этой потребности", "error");
          return;
        }
        assignContext = { candidateId, invitationId };
        const titleEl = document.getElementById("assign-test-title");
        const subEl = document.getElementById("assign-test-sub");
        titleEl.textContent = "";
        titleEl.append("Назначить тест · ", btn.dataset.candidateName || "кандидат");
        if (btn.dataset.needTitle) {
          subEl.textContent = "";
          subEl.append("Потребность: ", btn.dataset.needTitle);
          subEl.hidden = false;
        } else {
          subEl.hidden = true;
        }
        const listEl = document.getElementById("assign-test-list");
        listEl.innerHTML = tests
          .map((t) => {
            const need = t.needTitle ? esc(t.needTitle) : "—";
            const qn = t.questionCount != null ? t.questionCount : "—";
            return `<button type="button" class="assign-test-option" data-test-id="${esc(t.id)}">
              <strong>${esc(t.title)}</strong>
              <span class="invite-meta">${need} · ${qn} вопр.</span>
            </button>`;
          })
          .join("");
        document.getElementById("assign-test-err").hidden = true;
        document.getElementById("assign-test-sheet").classList.remove("hidden");
        listEl.querySelectorAll("[data-test-id]").forEach((opt) => {
          opt.addEventListener("click", () => submitAssignTest(opt.dataset.testId));
        });
      }

      async function submitAssignTest(testId) {
        if (!assignContext) return;
        const errEl = document.getElementById("assign-test-err");
        errEl.hidden = true;
        try {
          await HandCheck.api(`/api/employer/tests/${testId}/assign`, {
            method: "POST",
            body: JSON.stringify({
              candidateId: assignContext.candidateId,
              invitationId: assignContext.invitationId,
            }),
          });
          HandCheck.toast("Тест назначен", "success");
          closeAssignSheet();
          await loadInvitations();
        } catch (e) {
          errEl.hidden = false;
          errEl.textContent = HandCheck.formatApiError(e);
        }
      }

      async function assignTestToCandidate(btn) {
        await openAssignTestSheet(btn);
      }

      document.getElementById("assign-test-cancel")?.addEventListener("click", closeAssignSheet);
      document.getElementById("assign-test-sheet")?.addEventListener("click", (e) => {
        if (e.target.id === "assign-test-sheet") closeAssignSheet();
      });

      HandCheck.bootCabinetPage("employer", () =>
        loadInvitations().catch(() => {
          list.innerHTML = HandCheck.emptyState("Ошибка загрузки", "Попробуйте обновить страницу.", null);
        })
      );
    </script>
  </body>
</html>
