name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: npm test + validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cached static ffmpeg/ffprobe (avoids apt mirror stalls that consumed the job timeout on PR #45).
      - name: Setup ffmpeg
        id: setup_ffmpeg
        timeout-minutes: 5
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3.1
        with:
          ffmpeg-version: release
          linking-type: static

      - name: Setup ffmpeg (apt fallback)
        if: steps.setup_ffmpeg.outcome == 'failure'
        timeout-minutes: 5
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 4
          max_attempts: 2
          retry_wait_seconds: 20
          command: |
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=90 \
              -o Acquire::https::Timeout=90 \
              update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Unit tests
        run: npm test

      - name: Cabinet browser regression
        run: timeout --signal=TERM --kill-after=30s 20m npm run test:browser
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo

      - name: API validators
        run: npm run validate
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo
