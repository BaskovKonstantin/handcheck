<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кандидат · HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell narrow">
      <p class="eyebrow"><a href="/">HandCheck</a> · кандидат</p>
      <h1>Заглушка профиля</h1>
      <p class="lede">
        Здесь будет опрос + тест. Пока сохраняем категорию вручную (in-memory).
      </p>
      <form id="form" class="card">
        <label>
          Специализация
          <select name="specialization" required>
            <option value="backend">backend</option>
            <option value="frontend">frontend</option>
            <option value="fullstack">fullstack</option>
            <option value="devops">devops</option>
            <option value="data">data</option>
          </select>
        </label>
        <label>
          Грейд
          <select name="grade" required>
            <option value="junior">junior</option>
            <option value="middle">middle</option>
            <option value="senior">senior</option>
          </select>
        </label>
        <button type="submit" class="btn">Сохранить категорию</button>
      </form>
      <pre id="out" class="out"></pre>
    </main>
    <script>
      const form = document.getElementById("form");
      const out = document.getElementById("out");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const res = await fetch("/api/candidates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      });
    </script>
  </body>
</html>
