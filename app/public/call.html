<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Звонок — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="call-room">
      <h1>Комната звонка</h1>
      <label>
        <input type="checkbox" id="consent" />
        Разговор сохранится и будет использован, чтобы оценить соответствие задаче.
      </label>
      <p><span class="rec-dot"></span>Запись</p>
      <video id="local" class="call-video" autoplay muted playsinline></video>
      <p id="timer">00:00</p>
      <button class="btn-primary" id="join" disabled>Войти</button>
      <button class="btn-ghost" id="end" hidden>Завершить</button>
    </main>
    <script src="/app.js"></script>
    <script src="/call.js"></script>
  </body>
</html>
