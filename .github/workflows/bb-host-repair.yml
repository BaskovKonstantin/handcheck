name: BB host repair
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: getBB serverUrl for host daemon
        required: true
        default: http://192.168.0.5:38886
jobs:
  repair:
    runs-on: [self-hosted, konbas]
    steps:
      - name: Restart sshd and retarget bb host daemon
        env:
          SERVER_URL: ${{ inputs.server_url }}
          CFG: /home/kon/.bb-machines/192.168.0.4-38886/config.json
        run: |
          set -eux
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"
          echo "runner=$(hostname) user=$(whoami) uid=$(id -u) SERVER_URL=$SERVER_URL"
          sudo systemctl restart ssh.service || sudo systemctl restart sshd.service || true
          sleep 2
          sudo systemctl is-active ssh.service || true
          curl -sS -m 5 "$SERVER_URL/api/v1/system/version" || true
          echo
          UNIT="$HOME/.config/systemd/user/bb-host-daemon-192-168-0-4-38886-host_w4gsx29th4.service"
          DROP="$HOME/.config/systemd/user/bb-host-daemon-192-168-0-4-38886-host_w4gsx29th4.service.d"
          mkdir -p "$DROP"
          printf '%s\n' '[Service]' 'Environment=HOME=/home/kon' 'Environment=USER=kon' 'Environment=PATH=/home/kon/.local/bin:/usr/local/bin:/usr/bin:/bin' > "$DROP/cursor-path.conf"
          if [ -f "$UNIT" ]; then
            sed -i "s|--server-url \"[^\"]*\"|--server-url \"$SERVER_URL\"|" "$UNIT"
            grep server-url "$UNIT" || true
          fi
          if [ -f "$CFG" ]; then
            python3 -c 'import json,os; p=os.environ["CFG"]; u=os.environ["SERVER_URL"]; c=json.load(open(p)); c["serverUrl"]=u; json.dump(c, open(p,"w"), indent=2); print("config", c["serverUrl"])'
          fi
          systemctl --user daemon-reload
          systemctl --user restart bb-host-daemon-192-168-0-4-38886-host_w4gsx29th4.service
          sleep 6
          systemctl --user is-active bb-host-daemon-192-168-0-4-38886-host_w4gsx29th4.service
          systemctl --user status bb-host-daemon-192-168-0-4-38886-host_w4gsx29th4.service --no-pager | head -25
          uptime
