<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-gate-page">
    <div class="aw-bg" aria-hidden="true">
      <div class="aw-grid"></div>
      <div class="aw-kenburns"></div>
      <div class="aw-aurora aw-aurora-a"></div>
      <div class="aw-aurora aw-aurora-b"></div>
      <div class="aw-grain"></div>
      <span class="aw-corner aw-corner-tl"></span>
      <span class="aw-corner aw-corner-tr"></span>
      <span class="aw-corner aw-corner-bl"></span>
      <span class="aw-corner aw-corner-br"></span>
    </div>

    <main class="login-gate" aria-labelledby="login-title">
      <a class="logo login-gate-logo aw-enter aw-enter-1" href="/" id="logo">HandCheck</a>

      <p class="aw-pill aw-enter aw-enter-2">
        <span class="aw-pill-dot-wrap" aria-hidden="true">
          <span class="aw-pill-dot"></span>
          <span class="aw-pill-ping"></span>
        </span>
        HANDCHECK · КАТЕГОРИЯ ПО НАВЫКУ
      </p>

      <h1 class="login-gate-title" id="login-title">
        <span class="aw-line"><span class="aw-line-inner aw-rise-1">Тест, который <span class="aw-accent">считается.</span></span></span>
        <span class="aw-line"><span class="aw-line-inner aw-rise-2">Приглашение с <span class="aw-accent">вилкой.</span></span></span>
      </h1>

      <p class="login-gate-lede aw-enter aw-enter-3">
        Быстрый демо-вход в кабинет. Контакты скрыты до принятия приглашения.
      </p>

      <div class="login-gate-quick aw-enter aw-enter-4" id="quick-wrap">
        <button type="button" class="aw-btn aw-btn-primary login-gate-btn" id="btn-employer">
          <span>Войти как работодатель</span>
          <span class="aw-btn-shine" aria-hidden="true"></span>
        </button>
        <button type="button" class="aw-btn aw-btn-primary login-gate-btn" id="btn-candidate">
          <span>Войти как соискатель</span>
          <span class="aw-btn-shine" aria-hidden="true"></span>
        </button>
      </div>

      <details class="login-gate-manual aw-enter aw-enter-5">
        <summary>Вход по email</summary>
        <div class="login-gate-panel">
          <label>Email <input type="email" id="email" autocomplete="username" /></label>
          <label>Пароль <input type="password" id="password" autocomplete="current-password" /></label>
          <p class="field-error" id="err" hidden></p>
          <button class="aw-btn aw-btn-primary" type="button" id="btn-login">
            <span>Войти</span>
            <span class="aw-btn-shine" aria-hidden="true"></span>
          </button>
        </div>
      </details>

      <p class="field-error" id="quick-err" hidden></p>

      <p class="login-gate-footer aw-enter aw-enter-6">
        <a href="/privacy">Уведомление по 152-ФЗ</a>
      </p>
    </main>

    <script src="/app.js"></script>
    <script>
      document.getElementById("logo").innerHTML = `${HandCheck.LOGO_MARK}<span>HandCheck</span>`;

      function cacheEmail(email, role) {
        try {
          if (email) sessionStorage.setItem("hc_me_email", email);
          if (role) sessionStorage.setItem("hc_me_role", role);
        } catch {
          /* ignore */
        }
      }

      function goCabinet(role) {
        location.href = role === "employer" ? "/employer/overview" : "/candidate/today";
      }

      function showQuickErr(msg) {
        const el = document.getElementById("quick-err");
        el.hidden = !msg;
        el.textContent = msg || "";
      }

      async function demoLogin(role) {
        showQuickErr("");
        const btnEmp = document.getElementById("btn-employer");
        const btnCand = document.getElementById("btn-candidate");
        btnEmp.disabled = true;
        btnCand.disabled = true;
        try {
          const j = await HandCheck.api("/api/auth/demo-login", {
            method: "POST",
            body: JSON.stringify({ role }),
          });
          cacheEmail(j.user?.email, j.user?.role);
          goCabinet(j.user.role);
        } catch (e) {
          showQuickErr(HandCheck.formatApiError(e) || "Демо-вход недоступен");
          btnEmp.disabled = false;
          btnCand.disabled = false;
        }
      }

      document.getElementById("btn-employer").onclick = () => demoLogin("employer");
      document.getElementById("btn-candidate").onclick = () => demoLogin("candidate");

      document.getElementById("btn-login").onclick = async () => {
        const err = document.getElementById("err");
        err.hidden = true;
        try {
          const email = document.getElementById("email").value.trim();
          const j = await HandCheck.api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email,
              password: document.getElementById("password").value,
            }),
          });
          cacheEmail(j.user?.email || email, j.user?.role);
          goCabinet(j.user.role);
        } catch (e) {
          err.hidden = false;
          err.textContent = HandCheck.formatApiError(e);
        }
      };

      HandCheck.api("/api/me")
        .then((me) => {
          if (me?.user?.role) goCabinet(me.user.role);
        })
        .catch(() => {});
    </script>
  </body>
</html>
