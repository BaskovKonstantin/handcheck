<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отложенные — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Отложенные</h1>
          <p class="lede">Кандидаты, которых вы отложили в колоде. Верните в подбор или пригласите из списка.</p>
        </div>
      </header>
      <div id="need-switcher-host"></div>
      <div id="stats"></div>
      <div id="list"></div>
      <div id="more-host" class="filter-actions" hidden></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      const statsEl = document.getElementById("stats");
      const moreHost = document.getElementById("more-host");
      let needId = null;
      const PAGE_SIZE = 20;
      let loadedItems = [];
      let deferredTotal = 0;
      let deferredOffset = 0;

      function renderCards(items) {
        const esc = HandCheck.escapeHtml;
        return items
          .map(
            (x) =>
              `<article class="invite-card invite-card-expressive invite-card-status-sent">
                <div class="invite-card-top">
                  <h3>${esc(x.displayName)}</h3>
                  <span class="category-pill">${esc(x.categoryLabel)}</span>
                </div>
                <button class="btn-ghost btn-sm" data-c="${esc(x.candidateId)}">Вернуть в колоду</button>
              </article>`
          )
          .join("");
      }

      function bindRestoreButtons(rootEl) {
        rootEl.querySelectorAll("button[data-c]").forEach((b) => {
          b.onclick = async () => {
            await HandCheck.api(`/api/employer/needs/${needId}/reviews/${b.dataset.c}`, {
              method: "DELETE",
            });
            location.reload();
          };
        });
      }

      function updateMoreButton() {
        const remaining = deferredTotal - loadedItems.length;
        if (remaining <= 0) {
          moreHost.hidden = true;
          moreHost.innerHTML = "";
          return;
        }
        moreHost.hidden = false;
        moreHost.innerHTML = `<button class="btn-ghost" type="button" id="load-more-deferred">Показать ещё (${remaining})</button>`;
        document.getElementById("load-more-deferred").onclick = () => loadMoreDeferred();
      }

      async function loadMoreDeferred() {
        const d = await HandCheck.api(
          `/api/employer/needs/${needId}/deferred?limit=${PAGE_SIZE}&offset=${deferredOffset}`
        );
        deferredTotal = d.total ?? loadedItems.length;
        const batch = d.items || [];
        deferredOffset += batch.length;
        loadedItems = loadedItems.concat(batch);
        const grid = list.querySelector(".invite-card-grid");
        if (grid) {
          grid.insertAdjacentHTML("beforeend", renderCards(batch));
          bindRestoreButtons(grid);
        }
        updateMoreButton();
      }

      async function loadDeferred() {
        const esc = HandCheck.escapeHtml;
        statsEl.innerHTML = HandCheck.skeletonBlocks(2);
        list.innerHTML = HandCheck.skeletonBlocks(2);
        moreHost.hidden = true;
        loadedItems = [];
        deferredOffset = 0;
        deferredTotal = 0;
        const needsRes = await HandCheck.api("/api/employer/needs");
        const needs = needsRes.items || [];
        const params = new URLSearchParams(location.search);
        needId = HandCheck.resolveEmployerNeedId(needs, params);
        if (needId) HandCheck.persistEmployerNeedId(needId);
        const host = document.getElementById("need-switcher-host");
        if (host) {
          host.innerHTML = needId ? HandCheck.employerNeedSwitcherHtml(needs, needId) : "";
          HandCheck.bindEmployerNeedSwitcher((id) => {
            needId = id;
            loadDeferred();
          });
        }
        if (!needId) {
          list.innerHTML = HandCheck.emptyState(
            "Нет потребности",
            "Сначала опишите потребность.",
            "/employer/need",
            "К потребности"
          );
          return;
        }
        const d = await HandCheck.api(
          `/api/employer/needs/${needId}/deferred?limit=${PAGE_SIZE}&offset=0`
        );
        loadedItems = d.items || [];
        deferredTotal = d.total ?? loadedItems.length;
        deferredOffset = loadedItems.length;
        const count = deferredTotal;
        statsEl.innerHTML = HandCheck.statTilesHtml([
          {
            variant: "forest",
            label: "В отложенных",
            value: count,
            hint: count ? "Можно вернуть в колоду" : "Кнопка «Отложить» в колоде",
            link: count ? { href: `/employer/deck?need=${needId}`, label: "Колода" } : null,
          },
          {
            variant: "clay",
            label: "Список",
            value: "→",
            hint: "Все кандидаты по потребности",
            link: { href: `/employer/list?need=${needId}`, label: "Открыть" },
          },
        ]);
        if (!count) {
          list.innerHTML = HandCheck.emptyState(
            "Нет отложенных",
            "В колоде нажмите «Отложить», если кандидат интересен, но не сейчас.",
            `/employer/deck?need=${needId}`,
            "В колоду"
          );
          return;
        }
        list.innerHTML = `<div class="invite-card-grid">${renderCards(loadedItems)}</div>`;
        bindRestoreButtons(list);
        updateMoreButton();
      }

      HandCheck.bootCabinetPage("employer", () => loadDeferred());
    </script>
  </body>
</html>
