<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Задания — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Тест</h1>
          <p class="lede">8 коротких ответов (минута на каждый) и мини-проект на неделю. Результат — категория, не балл.</p>
        </div>
      </header>
      <div id="panel" class="panel"></div>
    </main>
    <script src="/app.js"></script>
    <script src="/assessment-input-classify.js"></script>
    <script src="/tasks-answer-drop.js"></script>
    <script src="/tasks-draft-persist.js"></script>
    <script>
      const panel = document.getElementById("panel");
      let attemptId = null;

      const SPECS = [
        { value: "backend", label: "Backend" },
        { value: "frontend", label: "Frontend" },
        { value: "qa", label: "QA" },
      ];
      const GRADES = [
        { value: "junior", label: "Junior" },
        { value: "middle", label: "Middle" },
        { value: "senior", label: "Senior" },
      ];

      const QUICK_COUNT = 8;

      function setQuestionChrome(active) {
        document.body.classList.toggle("assessment-question-active", Boolean(active));
      }

      function batteryStepIndicator(currentIndex) {
        const total = QUICK_COUNT + 1;
        const stepNum = Math.min(currentIndex + 1, total);
        const currentLabel =
          currentIndex < QUICK_COUNT ? `Короткий ${currentIndex + 1}` : "Мини-проект";
        const pct = Math.round((stepNum / total) * 100);
        const compact = `<div class="battery-progress-compact" id="battery-progress-compact" aria-live="polite">
          <div class="battery-progress-head">
            <span class="battery-progress-title">Шаг ${stepNum} из ${total}</span>
            <span class="battery-progress-current" id="battery-current-step">${currentLabel}</span>
          </div>
          <div class="battery-progress-bar" role="progressbar" aria-valuenow="${stepNum}" aria-valuemin="1" aria-valuemax="${total}" aria-label="Прогресс теста">
            <div class="battery-progress-fill" style="width:${pct}%"></div>
          </div>
        </div>`;
        const steps = [];
        for (let i = 0; i < QUICK_COUNT; i += 1) {
          const state = i < currentIndex ? "done" : i === currentIndex ? "current" : "";
          steps.push(`<li class="battery-step ${state}" aria-current="${i === currentIndex ? "step" : "false"}">
            <span class="battery-step-num">${i + 1}</span>
            <span class="battery-step-label">Короткий ${i + 1}</span>
          </li>`);
        }
        const workState =
          currentIndex >= QUICK_COUNT ? (currentIndex === QUICK_COUNT ? "current" : "done") : "";
        steps.push(`<li class="battery-step battery-step-work ${workState}">
          <span class="battery-step-num">${QUICK_COUNT + 1}</span>
          <span class="battery-step-label">Мини-проект</span>
        </li>`);
        return `${compact}<ol class="battery-steps battery-steps-full" aria-label="Шаги теста">${steps.join("")}</ol>`;
      }

      function formatCountdown(ms, opts = {}) {
        if (ms <= 0) return "0:00";
        const totalSec = Math.ceil(ms / 1000);
        const d = Math.floor(totalSec / 86400);
        const h = Math.floor((totalSec % 86400) / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (opts.workWeek && d >= 0) {
          const daysLeft = Math.max(0, Math.ceil(totalSec / 86400));
          if (daysLeft >= 1) return `${daysLeft} д 0 ч`;
        }
        if (d > 0) return `${d} д ${h} ч`;
        if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      async function postTelemetry(events) {
        if (!events.length) return;
        try {
          await HandCheck.api("/api/assessment/events", {
            method: "POST",
            body: JSON.stringify({ events }),
          });
        } catch {
          /* ignore */
        }
      }

      function isChoiceAvailable(field, value) {
        if (field === "spec" || field === "specialization") return value === "backend";
        if (field === "grade") return value === "middle";
        return false;
      }

      function choiceChips(name, options, selected) {
        return `<div class="choice-chip-row" role="radiogroup" aria-label="${name}">
          ${options
            .map((o) => {
              const available = isChoiceAvailable(name, o.value);
              const cls = `choice-chip${o.value === selected ? " active" : ""}${available ? "" : " disabled"}`;
              const hint = available ? "" : ' <span class="invite-meta">скоро</span>';
              return `<button type="button" class="${cls}" data-choice="${o.value}" data-field="${name}"${
                available ? "" : " disabled"
              }>${o.label}${hint}</button>`;
            })
            .join("")}
          <input type="hidden" id="${name}" value="${selected}" />
        </div>`;
      }

      function bindChoiceChips(root) {
        root.querySelectorAll(".choice-chip:not(.disabled)").forEach((btn) => {
          btn.addEventListener("click", () => {
            const field = btn.dataset.field;
            root.querySelectorAll(`.choice-chip[data-field="${field}"]`).forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(field).value = btn.dataset.choice;
          });
        });
      }

      async function renderStartForm(category) {
        setQuestionChrome(false);
        const onCooldown = Boolean(category?.cooldownActive && category?.retakeAt);
        const retakeWhen = onCooldown ? HandCheck.formatRetakeDateMoscow(category.retakeAt) : "";
        const retakeExplain = retakeWhen
          ? `<p class="invite-meta">Пересдать тест можно после ${retakeWhen} — успешная пересдача обновит категорию.</p>`
          : `<p class="invite-meta">Успешная пересдача обновит категорию.</p>`;
        const catBlock = category?.label
          ? `<div class="battery-last-result">
              <span class="invite-meta">Текущая категория</span>
              <span class="category-pill">${category.label}</span>
              ${retakeExplain}
            </div>`
          : `<p class="invite-meta">${onCooldown ? "Категория не подтверждена." : "Категория появится после первого завершённого теста."}</p>${retakeWhen ? retakeExplain : ""}`;
        panel.innerHTML = `
          ${catBlock}
          <p class="invite-meta">Выберите специализацию и грейд. Сейчас доступна только категория Backend × Middle — другие тесты готовятся.</p>
          <div class="form-field">
            <span class="form-label">Специализация</span>
            ${choiceChips("spec", SPECS, "backend")}
          </div>
          <div class="form-field">
            <span class="form-label">Грейд</span>
            ${choiceChips("grade", GRADES, "middle")}
          </div>
          <label class="consent-option">
            <input type="checkbox" id="assessment-privacy" />
            <span>Начиная тест, я даю согласие на обработку персональных данных в соответствии с <a href="/privacy" target="_blank" rel="noopener">Уведомлением по 152-ФЗ</a>.</span>
          </label>
          <button class="btn-primary" id="start" type="button" ${onCooldown ? "disabled" : ""} ${
            onCooldown ? `title="Пересдача возможна после ${retakeWhen}"` : ""
          }>${onCooldown ? "Пересдача недоступна" : "Пройти тест"}</button>
          <p class="field-error" id="err" hidden></p>`;
        bindChoiceChips(panel);
        document.getElementById("start").onclick = async () => {
          if (onCooldown) return;
          const err = document.getElementById("err");
          err.hidden = true;
          if (!document.getElementById("assessment-privacy").checked) {
            err.hidden = false;
            err.textContent = "Подтвердите согласие на обработку персональных данных.";
            return;
          }
          const spec = document.getElementById("spec").value;
          const grade = document.getElementById("grade").value;
          if (spec !== "backend" || grade !== "middle") {
            err.hidden = false;
            err.textContent = "Тест для выбранной категории пока не готов.";
            return;
          }
          try {
            await HandCheck.api("/api/assessment/battery/start", {
              method: "POST",
              body: JSON.stringify({ specialization: spec, grade, privacyConsent: true }),
            });
            await init();
          } catch (e) {
            err.hidden = false;
            err.textContent = HandCheck.formatApiError(e);
          }
        };
      }

      async function init() {
        const seq = HandCheck.nextCabinetPageLoad();
        setQuestionChrome(false);
        panel.innerHTML = HandCheck.skeletonBlocks(2);
        const [cur, category] = await Promise.all([
          HandCheck.api("/api/assessment/battery/current"),
          HandCheck.api("/api/candidate/category").catch(() => ({ label: null })),
        ]);
        if (HandCheck.isStaleCabinetPageLoad(seq)) return;
        if (!cur.battery) {
          await renderStartForm(category);
          return;
        }
        const attempts = cur.battery.attempts || [];
        const submitted = attempts.filter((a) => a.submitted).length;
        const next = attempts.find((a) => !a.submitted);
        if (!next) {
          const onCooldown = Boolean(category?.cooldownActive && category?.retakeAt);
          const retakeWhen = onCooldown ? HandCheck.formatRetakeDateMoscow(category.retakeAt) : "";
          const doneMsg = category.label
            ? `Ваша категория: ${category.label}. Обновление на экране «Сегодня».`
            : onCooldown
              ? `Категория не подтверждена. Пересдача возможна после ${retakeWhen} (Москва).`
              : "Категория обновится на экране «Сегодня».";
          panel.innerHTML =
            batteryStepIndicator(QUICK_COUNT + 1) +
            HandCheck.emptyState("Тест завершён", doneMsg, "/candidate/today", "Открыть сегодня");
          return;
        }
        attemptId = next.id;
        let t = await HandCheck.api(`/api/assessment/tasks/${attemptId}`);
        if (t.needsOpen) {
          panel.innerHTML = `
            ${batteryStepIndicator(submitted)}
            <p class="invite-meta">${HandCheck.escapeHtml(
              HandCheck.formatSpecGradeLabel(cur.battery.specialization, cur.battery.claimedGrade)
            )}</p>
            <p class="invite-meta">Короткие вопросы — по одной минуте после нажатия «Начать вопрос». Мини-проект — неделя.</p>
            <button class="btn-primary" id="open-q" type="button">Начать вопрос</button>
            <p class="field-error" id="err" hidden></p>`;
          document.getElementById("open-q").onclick = async () => {
            const err = document.getElementById("err");
            err.hidden = true;
            try {
              await HandCheck.api(`/api/assessment/tasks/${attemptId}/open`, { method: "POST" });
              await init();
            } catch (e) {
              err.hidden = false;
              err.textContent = HandCheck.formatApiError(e);
            }
          };
          return;
        }
        const draftKey = HandCheckTasksDraft.draftStorageKey(attemptId);
        const stored = HandCheckTasksDraft.parseStoredDraft(localStorage.getItem(draftKey));
        const restored = HandCheckTasksDraft.pickRestoredDraftText(stored.text, t.draftText || "");
        const stepIndex = submitted;
        const metaLine = HandCheck.formatSpecGradeLabel(
          cur.battery.specialization,
          cur.battery.claimedGrade
        );
        const answerMax = t.answerMax || 4000;
        const workDeadlineHint =
          t.type === "work" && t.deadlineAt
            ? ` (до ${HandCheck.formatDateTimeMoscow(t.deadlineAt)})`
            : "";
        const timerLabel =
          t.type === "quick"
            ? "Минута на ответ"
            : `Неделя на мини-проект${workDeadlineHint}`;
        panel.innerHTML = `
          ${batteryStepIndicator(stepIndex)}
          <p class="invite-meta">${HandCheck.escapeHtml(metaLine)}</p>
          <p class="battery-timer" id="timer-line" aria-live="polite"><span class="battery-timer-label">${timerLabel}:</span> <strong id="timer-val">—</strong></p>
          <p class="task-prompt">${HandCheck.escapeHtml(t.prompt)}</p>
          <textarea id="answer" class="${t.type === "work" ? "work-answer" : ""}" rows="${t.type === "work" ? 10 : 5}" maxlength="${answerMax}">${HandCheck.escapeHtml(restored)}</textarea>
          <p class="invite-meta" id="answer-len">0 / ${answerMax} символов</p>
          <p class="invite-meta" id="draft-note" hidden>Черновик восстановлен</p>
          <button class="btn-primary" id="submit">Отправить ответ</button>
          <p class="field-error" id="err" hidden></p>`;
        setQuestionChrome(true);
        const progressCompact = document.getElementById("battery-progress-compact");
        if (progressCompact) {
          progressCompact.scrollIntoView({ block: "nearest", behavior: "instant" });
        }
        if (restored) document.getElementById("draft-note").hidden = false;
        const ta = document.getElementById("answer");
        const lenEl = document.getElementById("answer-len");
        const syncLen = () => {
          lenEl.textContent = `${ta.value.length} / ${answerMax} символов`;
        };
        syncLen();
        const draftLifecycle = HandCheckTasksDraft.createWorkDraftLifecycle({
          attemptId,
          taskType: t.type,
          getText: () => ta.value,
          storage: localStorage,
          saveDraft: (text) =>
            HandCheck.api(`/api/assessment/tasks/${attemptId}/draft`, {
              method: "PATCH",
              body: JSON.stringify({ answerText: text }),
            }),
          shouldSkip: () => submitting || suppressDraft,
        });
        draftLifecycle.start();
        ta.addEventListener("input", syncLen);
        ta.addEventListener("input", () => draftLifecycle.scheduleLocalFromInput());
        let firstInputSent = false;
        const telemetryQueue = [];
        let telemetryChain = Promise.resolve();
        let telemetryOpen = true;
        const flushTelemetry = () => {
          if (!telemetryOpen || !telemetryQueue.length) return telemetryChain;
          const batch = telemetryQueue.splice(0, telemetryQueue.length);
          telemetryChain = telemetryChain.then(() => postTelemetry(batch));
          return telemetryChain;
        };
        const flushTelemetryBeacon = () => {
          if (!telemetryOpen || !telemetryQueue.length) return;
          const batch = telemetryQueue.splice(0, telemetryQueue.length);
          const body = JSON.stringify({ events: batch });
          const url = "/api/assessment/events";
          if (navigator.sendBeacon) {
            const blob = new Blob([body], { type: "application/json" });
            navigator.sendBeacon(url, blob);
            return;
          }
          void fetch(url, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body,
            keepalive: true,
          });
        };
        const enqueueEvent = (event_type, payload) => {
          if (!telemetryOpen) return;
          telemetryQueue.push({ attemptId, event_type, payload });
        };
        let pendingPasteChars = 0;
        ta.addEventListener("paste", (ev) => {
          const clip = ev.clipboardData?.getData("text") || "";
          const chars = clip.length;
          pendingPasteChars += chars;
          enqueueEvent("paste", { length: chars, chars });
        });
        let typedChars = restored.length;
        let typingPending = 0;
        let otherPending = 0;
        let typingFlushTimer = null;
        let otherFlushTimer = null;
        const flushTyping = () => {
          if (typingPending <= 0) return;
          const batch = typingPending;
          typingPending = 0;
          enqueueEvent("typing", { chars: batch });
          flushTelemetry();
        };
        const flushOther = () => {
          if (otherPending <= 0) return;
          const batch = otherPending;
          const inputType = otherPendingInputType;
          otherPending = 0;
          otherPendingInputType = "";
          enqueueEvent("other_insert", {
            chars: batch,
            inputType: inputType || "unknown",
          });
          flushTelemetry();
        };
        let otherPendingInputType = "";
        const classifyDelta = HandCheckInputClassify.classifyLengthIncrease;
        const dropHelpers = HandCheckTasksAnswerDrop || {};
        const caretAt = dropHelpers.caretOffsetFromPoint;
        const applyDrop = dropHelpers.applyTextDrop;
        let internalTextDrag = null;
        ta.addEventListener("dragstart", (ev) => {
          const start = ta.selectionStart ?? 0;
          const end = ta.selectionEnd ?? start;
          if (start === end) return;
          const slice = ta.value.slice(start, end);
          internalTextDrag = { start, end, text: slice };
          ev.dataTransfer?.setData("text/plain", slice);
          if (ev.dataTransfer) ev.dataTransfer.effectAllowed = "move";
        });
        ta.addEventListener("dragend", () => {
          internalTextDrag = null;
        });
        ta.addEventListener("dragover", (ev) => {
          ev.preventDefault();
          if (typeof caretAt === "function") {
            const idx = caretAt(ta, ev.clientX, ev.clientY);
            ta.setSelectionRange(idx, idx);
          }
          if (ev.dataTransfer) {
            ev.dataTransfer.dropEffect = internalTextDrag ? "move" : "copy";
          }
        });
        ta.addEventListener("drop", (ev) => {
          ev.preventDefault();
          const text = ev.dataTransfer?.getData("text") || "";
          const chars = text.length;
          enqueueEvent("drop", { chars });
          if (chars > 0) {
            const dropOffset =
              typeof caretAt === "function"
                ? caretAt(ta, ev.clientX, ev.clientY)
                : (ta.selectionStart ?? ta.value.length);
            const replaceStart = ta.selectionStart ?? ta.value.length;
            const replaceEnd = ta.selectionEnd ?? replaceStart;
            const moveFrom =
              internalTextDrag && internalTextDrag.text === text ? internalTextDrag : null;
            const applied =
              typeof applyDrop === "function"
                ? applyDrop({
                    value: ta.value,
                    dropOffset,
                    text,
                    moveFrom,
                    replaceStart: moveFrom ? null : replaceStart,
                    replaceEnd: moveFrom ? null : replaceEnd,
                  })
                : {
                    value:
                      ta.value.slice(0, replaceStart) + text + ta.value.slice(replaceEnd),
                    selectionStart: replaceStart + text.length,
                    selectionEnd: replaceStart + text.length,
                    insertedChars: chars,
                  };
            ta.value = applied.value;
            ta.setSelectionRange(applied.selectionStart, applied.selectionEnd);
            typedChars = ta.value.length;
            syncLen();
            if (!firstInputSent && ta.value.length > 0) {
              firstInputSent = true;
              enqueueEvent("first_input", { length: ta.value.length });
            }
            enqueueEvent("other_insert", { chars, inputType: "insertFromDrop" });
          }
          internalTextDrag = null;
          flushTelemetry();
        });
        ta.addEventListener("input", (ev) => {
          const len = ta.value.length;
          if (!firstInputSent && len > 0) {
            firstInputSent = true;
            enqueueEvent("first_input", { length: len });
          }
          if (
            typeof InputEvent !== "undefined" &&
            ev instanceof InputEvent &&
            ev.inputType === "insertFromDrop"
          ) {
            typedChars = len;
            return;
          }
          if (len > typedChars) {
            const delta = len - typedChars;
            typedChars = len;
            let inputType = "";
            if (typeof InputEvent !== "undefined" && ev instanceof InputEvent) {
              inputType = typeof ev.inputType === "string" ? ev.inputType : "";
            } else if (delta > 0) {
              inputType = "unknown";
            }
            const parts = classifyDelta(delta, inputType, pendingPasteChars);
            pendingPasteChars = Math.max(0, pendingPasteChars - parts.paste);
            if (parts.typing > 0) {
              typingPending += parts.typing;
              clearTimeout(typingFlushTimer);
              typingFlushTimer = setTimeout(flushTyping, 2000);
            }
            if (parts.other > 0) {
              otherPending += parts.other;
              otherPendingInputType = inputType || otherPendingInputType;
              clearTimeout(otherFlushTimer);
              otherFlushTimer = setTimeout(flushOther, 200);
            }
          } else if (len < typedChars) {
            typedChars = len;
          }
        });
        ta.addEventListener("focus", () => enqueueEvent("focus", null));
        ta.addEventListener("blur", () => enqueueEvent("blur", null));
        let submitting = false;
        let suppressDraft = false;
        const deadlineMs = t.deadlineAt ? new Date(t.deadlineAt).getTime() : null;
        const serverSkewMs =
          t.serverNow && deadlineMs ? new Date(t.serverNow).getTime() - Date.now() : 0;
        const remainingAnchor =
          typeof t.remainingMs === "number"
            ? { fetchedAt: Date.now(), remainingMs: t.remainingMs }
            : null;
        const timerVal = document.getElementById("timer-val");
        let tickTimer = null;
        const submitBtn = document.getElementById("submit");
        const errEl = document.getElementById("err");
        submitBtn.addEventListener("mousedown", () => {
          suppressDraft = true;
        });
        const submitAnswer = async (fromTimeout = false) => {
          if (submitting) return;
          errEl.hidden = true;
          const attemptsLeft = attempts.filter((a) => !a.submitted).length;
          if (!fromTimeout && attemptsLeft === 1) {
            const ok = window.confirm("Это последний ответ в тесте. Отправить и завершить тест?");
            if (!ok) return;
          }
          submitting = true;
          telemetryOpen = false;
          draftLifecycle.stop();
          if (tickTimer) clearInterval(tickTimer);
          clearTimeout(typingFlushTimer);
          clearTimeout(otherFlushTimer);
          flushTyping();
          flushOther();
          ta.readOnly = true;
          submitBtn.disabled = true;
          await flushTelemetry();
          try {
            await HandCheck.api(`/api/assessment/tasks/${attemptId}/submit`, {
              method: "POST",
              body: JSON.stringify({ answerText: ta.value }),
            });
            localStorage.removeItem(draftKey);
            if (attemptsLeft === 1) {
              const cat = await HandCheck.api("/api/candidate/category").catch(() => ({ label: null }));
              const onCooldown = Boolean(cat?.cooldownActive && cat?.retakeAt);
              const retakeWhen = onCooldown ? HandCheck.formatRetakeDateMoscow(cat.retakeAt) : "";
              const doneMsg = cat.label
                ? `Ваша категория: ${cat.label}. Обновление на экране «Сегодня».`
                : onCooldown
                  ? `Категория не подтверждена. Пересдача возможна после ${retakeWhen} (Москва).`
                  : "Категория обновится на экране «Сегодня».";
              panel.innerHTML =
                batteryStepIndicator(QUICK_COUNT + 1) +
                HandCheck.emptyState("Тест завершён", doneMsg, "/candidate/today", "Открыть сегодня");
              return;
            }
            await init();
          } catch (e) {
            if (e.data?.error === "quick_time_expired") {
              errEl.hidden = false;
              errEl.textContent = HandCheck.formatApiError(e);
              errEl.classList.add("timeout-notice");
              localStorage.removeItem(draftKey);
              setTimeout(() => init(), 1200);
              return;
            }
            errEl.hidden = false;
            errEl.textContent = HandCheck.formatApiError(e);
            submitting = false;
            if (!fromTimeout) {
              ta.readOnly = false;
              submitBtn.disabled = false;
            }
          }
        };
        submitBtn.onclick = () => submitAnswer(false);
        const remainingMsNow = () => {
          if (remainingAnchor) {
            return remainingAnchor.remainingMs - (Date.now() - remainingAnchor.fetchedAt);
          }
          if (deadlineMs) {
            return deadlineMs - (Date.now() + serverSkewMs);
          }
          return null;
        };
        const syncDeadlineUi = () => {
          const raw = remainingMsNow();
          if (raw === null) return;
          const left = Math.max(0, raw);
          timerVal.textContent = formatCountdown(left, { workWeek: t.type === "work" });
          if (t.type === "quick" && left <= 0 && !submitting) {
            void submitAnswer(true);
          }
        };
        if (deadlineMs || remainingAnchor) {
          syncDeadlineUi();
          const initialLeft = remainingMsNow();
          if (t.type === "quick" && initialLeft !== null && initialLeft <= 0) {
            void submitAnswer(true);
          } else {
            tickTimer = setInterval(syncDeadlineUi, 250);
          }
        }
        ta.addEventListener("blur", () => {
          flushTyping();
          flushTelemetry();
          draftLifecycle.persistOnBlur();
        });
        const onPageLifecycleFlush = () => {
          flushTyping();
          flushOther();
          flushTelemetryBeacon();
          draftLifecycle.flushOnLifecycleHide();
        };
        window.addEventListener("pagehide", onPageLifecycleFlush);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") onPageLifecycleFlush();
        });
      }

      HandCheck.bootCabinetPage("candidate", () =>
        init().catch(() => {
          panel.innerHTML = HandCheck.emptyState("Ошибка", "Войдите как кандидат.", "/auth", "Войти");
        })
      );
    </script>
  </body>
</html>
