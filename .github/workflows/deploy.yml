name: Deploy HandCheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Публичный репозиторий: доверяем только событиям основного репозитория.
# Форк не должен запускать код на self-hosted раннере оператора.
permissions:
  contents: read

concurrency:
  group: handcheck-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    if: github.repository == 'BaskovKonstantin/handcheck' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Только метка проекта: имя машины намеренно не используется.
    runs-on: [self-hosted, handcheck]
    steps:
      - name: Pull and rebuild (preserve /data volume and server .env)
        working-directory: /srv/homeserver/apps/handcheck
        run: |
          set -euo pipefail

          # Never wipe production SQLite or server secrets (untracked .env lives here).
          if [[ ! -f .env ]]; then
            echo "ERROR: .env missing in deploy directory — aborting (will not start compose)."
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main

          # Файлы для ссылок из формы сдачи (/downloads/...): дубли в репозитории не храним
          mkdir -p app/public/downloads
          cp -f docs/Documentation-HandCheck.pdf app/public/downloads/Documentation-HandCheck.pdf
          cp -f docs/presentation/HandCheck-ФСП-2026.pdf app/public/downloads/HandCheck-FSP-2026-presentation.pdf
          cp -f docs/presentation/HandCheck-ФСП-2026.pptx app/public/downloads/HandCheck-FSP-2026-presentation.pptx

          bash bin/handcheck-deploy-disk.sh precheck
          bash bin/handcheck-deploy-disk.sh tag-rollback

          # Named volume handcheck-data must survive rebuilds (declared in docker-compose.yml).
          if ! docker volume inspect handcheck_handcheck-data >/dev/null 2>&1; then
            if ! docker volume inspect handcheck-data >/dev/null 2>&1; then
              echo "WARN: handcheck data volume not found yet — compose will create handcheck-data on first up"
            fi
          fi

          # Rebuild image and recreate container only; do NOT run `down -v` or `volume rm`.
          export GIT_COMMIT="$(git rev-parse HEAD)"
          docker compose up -d --build --remove-orphans

          HEALTH_URL="http://127.0.0.1:8810/api/health"
          HEALTH_DEADLINE=$(( $(date +%s) + 120 ))
          HEALTH_OK=0
          while [ "$(date +%s)" -lt "$HEALTH_DEADLINE" ]; do
            if HEALTH_BODY="$(curl -fsS --max-time 8 "$HEALTH_URL" 2>/dev/null)"; then
              if echo "$HEALTH_BODY" | grep -q "\"commit\"[[:space:]]*:[[:space:]]*\"${GIT_COMMIT}\""; then
                HEALTH_OK=1
                break
              fi
              echo "WARN: health responded but commit mismatch (got: ${HEALTH_BODY:0:200})"
            fi
            sleep 2
          done
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "ERROR: /api/health did not return commit=${GIT_COMMIT} within 120s"
            curl -v --max-time 10 "$HEALTH_URL" || true
            exit 1
          fi

          if ! docker compose ps --status running | grep -q web; then
            echo "ERROR: web service is not running after deploy"
            docker compose ps
            exit 1
          fi

          bash bin/handcheck-deploy-disk.sh post-prune

          echo "Deploy OK: $(git rev-parse --short HEAD)"
