<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Колода — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="deck-page">
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Колода</h1>
          <p class="lede">Один жест — одно решение. Без фото и без числовых оценок.</p>
        </div>
      </header>
      <div class="deck-wrap" id="deck-wrap">
        <div id="deck-card" class="deck-card enter" hidden></div>
        <div class="deck-actions" id="deck-actions" hidden>
          <button class="btn-ghost" type="button" data-decision="rejected">Отказать</button>
          <button class="btn-ghost" type="button" data-decision="later">Отложить</button>
          <button class="btn-primary" type="button" id="invite-open">Пригласить</button>
        </div>
        <div class="deck-actions deck-actions-round" id="deck-actions-round" hidden>
          <button class="deck-act deck-act-reject" type="button" data-decision="rejected" aria-label="Отказать">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button class="deck-act deck-act-later" type="button" data-decision="later" aria-label="Отложить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2M12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="deck-act deck-act-invite" type="button" id="invite-open-round" aria-label="Пригласить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      <p class="empty" id="empty" hidden></p>
      <div id="deck-empty" hidden></div>
    </main>
    <div class="invite-sheet hidden" id="sheet">
      <div class="invite-panel">
        <h2>Приглашение</h2>
        <div class="salary-range">
          <label>От <input type="number" id="salary-from" min="0" step="1" /></label>
          <label>До <input type="number" id="salary-to" min="0" step="1" /></label>
          <p class="field-error" id="salary-range-err" hidden></p>
        </div>
        <label>Текст оффера <textarea id="offer-text" rows="3"></textarea></label>
        <label>Канал связи <input id="contact-channel" maxlength="64" /></label>
        <p class="field-error" id="invite-err" hidden></p>
        <button class="btn-primary" type="button" id="invite-send">Отправить</button>
        <button class="btn-ghost" type="button" id="invite-cancel">Отмена</button>
      </div>
    </div>
    <script src="/app.js"></script>
    <script src="/employer/deck.js"></script>
  </body>
</html>
