<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Прошлое — HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Прошлое</h1>
          <p class="lede">Завершённые тесты, ответы на приглашения и звонки — без внутреннего разбора.</p>
        </div>
      </header>
      <div id="content"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const host = document.getElementById("content");
      async function load() {
        host.innerHTML = HandCheck.skeletonBlocks(3);
        try {
          const data = await HandCheck.api("/api/candidate/past");
          const bat = (data.batteries || [])
            .map(
              (b) => `<article class="list-row-card row-link-static">
                <div><strong>${b.label}</strong><p class="invite-meta">${b.outcome} · ${HandCheck.formatDateTimeMoscow(b.completedAt)}${
                b.retakeAt ? ` · повтор с ${HandCheck.formatDateTimeMoscow(b.retakeAt)}` : ""
              }</p></div></article>`
            )
            .join("");
          const inv = (data.invitations || [])
            .map(
              (i) => `<article class="list-row-card row-link-static">
                <div><strong>${i.companyName}</strong> — ${i.needTitle}
                <p class="invite-meta">${HandCheck.invitationStatusLabel(i.status)} · ${HandCheck.formatSalaryRange(i.salaryFrom, i.salaryTo)} · ${HandCheck.formatDateTimeMoscow(i.at)}</p></div></article>`
            )
            .join("");
          const calls = (data.calls || [])
            .map(
              (c) => `<article class="list-row-card row-link-static">
                <div><strong>${c.companyName}</strong> — ${c.needTitle}
                <p class="invite-meta">Звонок завершён · ${HandCheck.formatDateTimeMoscow(c.endedAt)}</p></div></article>`
            )
            .join("");
          host.innerHTML = `
            ${HandCheck.timelineSection("Батареи тестов", bat ? [] : [])}
            <section class="timeline-section"><h2 class="timeline-heading">Батареи тестов</h2>${bat || '<p class="invite-meta">Пока нет завершённых батарей.</p>'}</section>
            <section class="timeline-section"><h2 class="timeline-heading">Приглашения</h2>${inv || '<p class="invite-meta">Нет отвеченных приглашений.</p>'}</section>
            <section class="timeline-section"><h2 class="timeline-heading">Звонки</h2>${calls || '<p class="invite-meta">Завершённых звонков пока нет.</p>'}</section>`;
        } catch {
          host.innerHTML = HandCheck.loadErrorState("Не удалось загрузить историю", "Повторите запрос.", load);
        }
      }
      HandCheck.bootCabinetPage("candidate", load);
    </script>
  </body>
</html>
