<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Звонки — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Звонки</h1>
          <p class="lede">После завершения — три фразы внутреннего разбора только для вас.</p>
        </div>
      </header>
      <div id="stats"></div>
      <div id="list"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const list = document.getElementById("list");
      const statsEl = document.getElementById("stats");
      const ICON_READY =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4h3l1 4-2 1a12 12 0 0 0 5 5l1-2 4 1v3c-6-1-11-6-12-12z" fill="currentColor"/></svg></span>';
      const ICON_LIVE =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span>';
      const ICON_DONE =
        '<span class="stat-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>';

      function formatTs(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "—";
        return d.toLocaleString("ru-RU", {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function groupCountLabel(n) {
        if (n <= 1) return "";
        const mod10 = n % 10;
        const mod100 = n % 100;
        let word = "звонков";
        if (mod10 === 1 && mod100 !== 11) word = "звонок";
        else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = "звонка";
        return `${n} ${word}`;
      }

      async function render() {
        const esc = HandCheck.escapeHtml;
        list.innerHTML = HandCheck.skeletonBlocks(3);
        statsEl.innerHTML = HandCheck.skeletonBlocks(1);
        const d = await HandCheck.api("/api/employer/calls");
        const items = d.items || [];
        const active = items.filter((r) => r.callStatus !== "ended");
        const ended = items.filter((r) => r.callStatus === "ended");
        const ready = active.filter((r) => r.callStatus !== "live").length;
        const live = active.filter((r) => r.callStatus === "live").length;
        statsEl.innerHTML = HandCheck.statTilesHtml(
          [
            { variant: "clay", icon: ICON_READY, label: "Готовы", value: ready, hint: "Комната открыта" },
            { variant: "forest", icon: ICON_LIVE, label: "В эфире", value: live, hint: "Идёт звонок" },
            { variant: "ink", icon: ICON_DONE, label: "Завершено", value: ended.length, hint: "С записью и разбором" },
          ],
          { gridClass: "stat-tile-grid-compact" }
        );
        if (!items.length) {
          list.innerHTML = HandCheck.emptyState(
            "Звонков пока нет",
            "Примите приглашение кандидатом, чтобы открыть комнату.",
            "/employer/invitations",
            "К приглашениям"
          );
          return;
        }
        const sorted = [...items].sort((a, b) => {
          const ka = a.endedAt || a.startedAt || a.invitationAt || "";
          const kb = b.endedAt || b.startedAt || b.invitationAt || "";
          return kb.localeCompare(ka);
        });
        const groups = new Map();
        for (const c of sorted) {
          const key = c.candidateId || c.candidateName || "—";
          if (!groups.has(key)) groups.set(key, { name: c.candidateName || "—", calls: [] });
          groups.get(key).calls.push(c);
        }
        const analyses = await Promise.all(
          sorted.map(async (c) => {
            if (c.callStatus !== "ended" || !c.callId) return { id: c.callId, text: "" };
            try {
              const a = await HandCheck.api(`/api/calls/${c.callId}/analysis`);
              return { id: c.callId, text: a.summaryText || a.summary_text };
            } catch {
              return { id: c.callId, text: "" };
            }
          })
        );
        const analysisByCall = new Map(analyses.filter((a) => a.id).map((a) => [a.id, a.text]));

        const html = [];
        for (const { name, calls } of groups.values()) {
          const countLabel = groupCountLabel(calls.length);
          html.push(`<section class="call-group"><h2 class="call-group-title">${esc(name)}${
            countLabel ? ` <span class="invite-meta">${esc(countLabel)}</span>` : ""
          }</h2>`);
          for (const c of calls) {
            const when = formatTs(c.endedAt || c.startedAt || c.invitationAt);
            const statusCls = HandCheck.callStatusClass(c.callStatus);
            const analysis = analysisByCall.get(c.callId);
            const analysisBlock = analysis
              ? `<p class="contacts-block">${esc(analysis)}</p>`
              : c.callStatus === "ended"
                ? '<p class="invite-meta">Разбор готовится…</p>'
                : "";
            const salary = HandCheck.formatSalaryRange(c.salaryFrom, c.salaryTo);
            const rec = c.hasRecording
              ? '<span class="status-pill accepted">есть запись</span>'
              : "";
            html.push(`<article class="invite-card call-entry">
              <div class="call-entry-meta">
                <span class="status-pill ${statusCls}">${HandCheck.callStatusLabel(c.callStatus)}</span>
                <span>${esc(when)}</span>
                ${rec}
              </div>
              <p class="invite-meta" style="margin-top:0">${esc(c.needTitle || "")}</p>
              <p class="salary-hero salary-hero-sm">${salary}</p>
              <a class="btn-primary btn-sm" href="${esc(c.roomUrl)}">${c.callStatus === "ended" ? "Итог" : "Комната"}</a>
              ${analysisBlock}
            </article>`);
          }
          html.push("</section>");
        }
        list.innerHTML = html.join("");
      }

      HandCheck.bootCabinetPage("employer", () =>
        render().catch(() => {
          list.innerHTML = HandCheck.emptyState("Ошибка загрузки", "Попробуйте обновить страницу.", null);
        })
      );
    </script>
  </body>
</html>
