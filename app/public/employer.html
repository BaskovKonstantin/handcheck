<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Работодатель · HandCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell narrow">
      <p class="eyebrow"><a href="/">HandCheck</a> · работодатель</p>
      <h1>Приглашения</h1>
      <p class="lede">
        Контакты кандидата скрыты до accept. Ниже — заглушка списка категорий и приглашения с вилкой ₽.
      </p>
      <div class="card">
        <h2>Кандидаты в базе</h2>
        <ul id="list"></ul>
      </div>
      <form id="form" class="card">
        <label>
          ID кандидата
          <input name="candidateId" required placeholder="c_…" />
        </label>
        <label>
          ЗП от (₽)
          <input name="salaryFrom" type="number" required value="180000" />
        </label>
        <label>
          ЗП до (₽)
          <input name="salaryTo" type="number" required value="250000" />
        </label>
        <button type="submit" class="btn">Отправить приглашение</button>
      </form>
      <pre id="out" class="out"></pre>
    </main>
    <script>
      const list = document.getElementById("list");
      const form = document.getElementById("form");
      const out = document.getElementById("out");

      async function refresh() {
        const data = await fetch("/api/candidates").then((r) => r.json());
        list.innerHTML = "";
        for (const item of data.items) {
          const li = document.createElement("li");
          li.textContent = `${item.id} — ${item.category}`;
          list.appendChild(li);
        }
        if (!data.items.length) {
          list.innerHTML = "<li>Пока пусто — сначала кабинет кандидата</li>";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const raw = Object.fromEntries(new FormData(form).entries());
        const res = await fetch("/api/invitations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            candidateId: raw.candidateId,
            salaryFrom: Number(raw.salaryFrom),
            salaryTo: Number(raw.salaryTo),
          }),
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      });

      refresh();
    </script>
  </body>
</html>
