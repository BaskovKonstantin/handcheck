<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Список — HandCheck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="column cabinet-content">
      <header class="cabinet-page-hero">
        <div class="cabinet-page-hero-pattern" aria-hidden="true"></div>
        <div class="cabinet-page-hero-inner">
          <h1>Список</h1>
          <p class="lede">Все подходящие категории по потребности — без рейтинга и фото.</p>
        </div>
      </header>
      <div id="need-switcher-host"></div>
      <form class="filter-bar" id="filters" onsubmit="return false">
        <label>Стек <input id="stack" placeholder="node" autocomplete="off" /></label>
        <label
          >Достижения ФСП (спортивное программирование)
          <select id="fsp">
            <option value="">Любые</option>
            <option value="1">Есть в профиле</option>
            <option value="0">Нет в профиле</option>
          </select></label
        >
        <div class="filter-actions">
          <button class="btn-primary btn-sm" type="button" id="apply">Применить</button>
        </div>
      </form>
      <div id="rows"></div>
    </main>
    <script src="/app.js"></script>
    <script>
      const rowsEl = document.getElementById("rows");
      const params = new URLSearchParams(location.search);
      document.getElementById("stack").value = params.get("stack") || "";
      document.getElementById("fsp").value = params.get("fsp") || "";

      let loadSeq = 0;
      let cachedNeedId = null;
      let cachedNeed = null;
      let cachedNeeds = [];

      function renderListRow(r) {
        const esc = HandCheck.escapeHtml;
        const invited =
          r.reviewStatus === "invited"
            ? '<span class="status-pill accepted">Приглашён</span>'
            : r.reviewStatus === "declined"
              ? '<span class="status-pill declined">Отклонил приглашение</span>'
              : "";
        const explain = (r.explanation || []).map((line) => `<li>${esc(line)}</li>`).join("");
        const aiChip = HandCheck.renderAiUsageSection(r.aiUsage, { compact: true });
        const aiBlock = aiChip ? `<div class="chip-row">${aiChip}</div>` : "";
        const stack = (r.stack || []).map((s) => `<span class="chip chip-skill">${esc(s)}</span>`).join("");
        const domains = (r.backgroundDomains || [])
          .map((d) => `<span class="chip">${esc(d)}</span>`)
          .join("");
        const actions =
          r.reviewStatus === "invited"
            ? `<div class="list-row-actions"><a class="btn-quiet btn-sm" href="/employer/invitations">К приглашениям</a></div>`
            : `<div class="list-row-actions">
                  <button type="button" class="btn-quiet btn-sm" data-decision="later" data-id="${r.id}">Отложить</button>
                  <button type="button" class="btn-quiet btn-sm" data-decision="rejected" data-id="${r.id}">Отказать</button>
                  <a class="btn-primary btn-sm list-invite-cta" href="/employer/deck">Пригласить</a>
                </div>`;
        return `<div class="list-row-card list-row-card-rich">
                <div class="list-row-main">
                  <div class="list-row-head">
                    <strong>${esc(r.displayName || "Кандидат")}</strong>
                    ${HandCheck.renderCategoryPill(r.categoryLabel, r.categoryStatus, r.gradeRelation)}
                    ${invited}
                  </div>
                  ${HandCheck.renderPasteInputMark(r.pasteInputMark)}
                  ${domains ? `<div class="chip-row">${domains}</div>` : ""}
                  ${stack ? `<div class="chip-row chip-row-skills">${stack}</div>` : ""}
                  ${explain ? `<ul class="deck-explain-lines list-explain">${explain}</ul>` : ""}
                  ${aiBlock}
                </div>
                ${actions}
              </div>`;
      }

      function bindListRowActions(root) {
        root.querySelectorAll("[data-decision]").forEach((btn) => {
          btn.onclick = () => review(btn.dataset.decision, btn.dataset.id);
        });
        root.querySelectorAll("[data-list-more]").forEach((btn) => {
          btn.onclick = () => {
            const section = btn.closest(".list-match-group");
            const hidden = section?.querySelector(".list-group-hidden");
            if (hidden) hidden.hidden = false;
            btn.remove();
          };
        });
      }

      function renderGroupedList(items, need) {
        const esc = HandCheck.escapeHtml;
        const buckets = new Map(HandCheck.EMPLOYER_MATCH_GROUPS.map((g) => [g.id, []]));
        for (const item of items) {
          const key = HandCheck.classifyEmployerMatchGroup(item, need);
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(item);
        }
        const sections = HandCheck.EMPLOYER_MATCH_GROUPS
          .map((group) => {
            const list = buckets.get(group.id) || [];
            if (!list.length) return "";
            const visible = list.slice(0, group.initialVisible);
            const hidden = list.slice(group.initialVisible);
            const openAttr = group.defaultOpen ? " open" : "";
            const rows = visible.map((r) => renderListRow(r)).join("");
            const hiddenRows = hidden.length
              ? `<div class="list-group-hidden" hidden>${hidden.map((r) => renderListRow(r)).join("")}</div>
                 <button type="button" class="btn-ghost btn-sm list-show-more" data-list-more="1">Показать ещё (${hidden.length})</button>`
              : "";
            return `<details class="list-match-group"${openAttr}>
              <summary class="list-match-group-head">
                <span class="list-match-group-title">${esc(group.title)}</span>
                <span class="list-match-group-count">${list.length}</span>
              </summary>
              <div class="list-match-group-body">${rows}${hiddenRows}</div>
            </details>`;
          })
          .filter(Boolean)
          .join("");
        return `<div class="list-grouped">${sections}</div>`;
      }

      function showSkeleton() {
        rowsEl.innerHTML = HandCheck.skeletonBlocks(4);
      }

      async function review(decision, candidateId) {
        try {
          await HandCheck.api(`/api/employer/needs/${cachedNeedId}/reviews`, {
            method: "POST",
            body: JSON.stringify({ decision, candidateId }),
          });
          await loadRows();
        } catch (e) {
          HandCheck.toast(
            HandCheck.formatApiError(e) || "Не удалось сохранить решение. Попробуйте ещё раз.",
            "error"
          );
          await loadRows();
        }
      }

      async function mountNeedSwitcher(needs, selectedId) {
        const host = document.getElementById("need-switcher-host");
        if (!host) return;
        host.innerHTML = selectedId ? HandCheck.employerNeedSwitcherHtml(needs, selectedId) : "";
        HandCheck.bindEmployerNeedSwitcher((id) => {
          cachedNeedId = id;
          cachedNeed = needs.find((n) => n.id === id) || null;
          HandCheck.persistEmployerNeedId(id);
          loadRows();
        });
      }

      async function loadRows() {
        const seq = ++loadSeq;
        showSkeleton();
        try {
          if (!cachedNeedId) {
            const needsRes = await HandCheck.api("/api/employer/needs");
            const needs = needsRes.items || [];
            cachedNeeds = needs;
            const params = new URLSearchParams(location.search);
            cachedNeedId = HandCheck.resolveEmployerNeedId(needs, params);
            if (cachedNeedId) HandCheck.persistEmployerNeedId(cachedNeedId);
            cachedNeed = needs.find((n) => n.id === cachedNeedId) || null;
            await mountNeedSwitcher(needs, cachedNeedId);
          }
          if (seq !== loadSeq) return;
          if (!cachedNeedId) {
            rowsEl.innerHTML = HandCheck.emptyState(
              "Нет потребности",
              "Сначала опишите потребность.",
              "/employer/need",
              "К потребности"
            );
            return;
          }
          const qs = location.search || "";
          const data = await HandCheck.api(`/api/employer/needs/${cachedNeedId}/matches${qs}`);
          if (seq !== loadSeq) return;
          if (!data.items?.length) {
            rowsEl.innerHTML = HandCheck.emptyState(
              "Подходящих кандидатов нет",
              "Проверьте фильтры или откройте колоду.",
              "/employer/deck",
              "В колоду"
            );
            return;
          }
          if (!cachedNeed && cachedNeeds.length) {
            cachedNeed = cachedNeeds.find((n) => n.id === cachedNeedId) || null;
          }
          rowsEl.innerHTML = renderGroupedList(data.items, cachedNeed);
          bindListRowActions(rowsEl);
        } catch {
          if (seq !== loadSeq) return;
          rowsEl.innerHTML = HandCheck.loadErrorState(
            "Не удалось загрузить список",
            "Проверьте соединение или повторите запрос.",
            () => loadRows()
          );
        }
      }

      document.getElementById("apply").onclick = () => {
        const p = new URLSearchParams(location.search);
        if (document.getElementById("stack").value) p.set("stack", document.getElementById("stack").value);
        else p.delete("stack");
        if (document.getElementById("fsp").value) p.set("fsp", document.getElementById("fsp").value);
        else p.delete("fsp");
        const q = p.toString();
        history.replaceState({}, "", q ? `/employer/list?${q}` : "/employer/list");
        loadRows();
      };

      HandCheck.bootCabinetPage("employer", async () => {
        const needsRes = await HandCheck.api("/api/employer/needs");
        const needs = needsRes.items || [];
        cachedNeeds = needs;
        const params = new URLSearchParams(location.search);
        cachedNeedId = HandCheck.resolveEmployerNeedId(needs, params);
        cachedNeed = needs.find((n) => n.id === cachedNeedId) || null;
        if (cachedNeedId) HandCheck.persistEmployerNeedId(cachedNeedId);
        await mountNeedSwitcher(needs, cachedNeedId);
        await loadRows();
      });
    </script>
  </body>
</html>
