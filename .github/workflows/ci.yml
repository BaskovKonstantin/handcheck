name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: npm test + validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Unit tests
        run: npm test

      - name: Cabinet browser regression
        run: timeout --signal=TERM --kill-after=30s 20m npm run test:browser
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo

      - name: API validators
        run: npm run validate
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo
