name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-validate:
    name: npm test + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Unit tests
        run: npm test

      - name: Cabinet browser regression
        run: npm run test:browser
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo

      - name: API validators
        run: npm run validate
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser smoke
        run: npm run test:browser
        env:
          DEMO_MODE: "1"
          DEMO_PASSWORD: demo-demo-demo
